name: E2E

on:
  pull_request:
  push:
    branches: [main]
  # Renders Linux baselines from the branch or tag picked in "Use workflow from"
  # (`gh workflow run e2e.yml --ref <branch>`).
  workflow_dispatch:

# A new push to a pull request replaces its older run. Every commit on main keeps its own run, so
# a burst of merges cannot leave main commits that were never checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# The browser, its system libraries and fonts come from the Playwright image, pinned by digest so a
# render only changes when the image (kept equal to @playwright/test) or the site changes. Actions
# are pinned to commits; the comment names the release.
env:
  TZ: UTC
  LANG: C.UTF-8
  HUSKY: "0"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  e2e-shard:
    if: github.event_name != 'workflow_dispatch'
    name: Playwright e2e (Chromium, Linux, shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One job passed 8 minutes once the visual comparison ran (937 + 46 tests, 481-512 s), so the
    # suite runs as two shards. Each shard runs its half of every check, visual ones included.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --ipc=host

    steps:
      # Tests run the pull request's own code, so the checkout keeps no token.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Pull request runs can read main's pnpm store cache but only save to their own ref's scope,
      # and pnpm checks every package against the lockfile's integrity hashes.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the image matches @playwright/test
        run: test "$(pnpm exec playwright --version)" = "Version 1.64.0"

      # Every route, viewport and platform the visual specs declare has a baseline, and no orphans.
      - name: Check the visual baseline inventory
        run: pnpm exec jest scripts/__tests__/visualBaselines.spec.ts

      - name: Build
        id: build
        run: pnpm build

      - name: Fingerprint the committed baselines
        id: fingerprint
        run: find e2e/__screenshots__ -type f -exec sha256sum {} + | sort > "$RUNNER_TEMP/baselines.sha256"

      - name: Run behavioural, responsive and accessibility checks
        run: sh .github/scripts/sample-resources.sh "Behavioural checks" pnpm exec playwright test --grep-invert @visual --shard=${{ matrix.shard }}/2

      # Runs even when a behavioural check failed, so one push reports both.
      - name: Compare visual baselines
        if: (success() || failure()) && steps.build.outcome == 'success'
        run: sh .github/scripts/sample-resources.sh "Visual comparison" pnpm exec playwright test --grep @visual --shard=${{ matrix.shard }}/2

      # CI compares only; new baselines come from the reviewed update-visual-baselines artifact.
      - name: Check that no baseline was written
        if: (success() || failure()) && steps.fingerprint.outcome == 'success'
        run: |
          find e2e/__screenshots__ -type f -exec sha256sum {} + | sort > "$RUNNER_TEMP/baselines-after.sha256"
          diff "$RUNNER_TEMP/baselines.sha256" "$RUNNER_TEMP/baselines-after.sha256"

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Keeps the check name the main ruleset requires, and passes only when every shard passed.
  e2e:
    if: always() && github.event_name != 'workflow_dispatch'
    name: Playwright e2e (Chromium, Linux)
    needs: e2e-shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every shard to pass
        env:
          SHARDS: ${{ needs.e2e-shard.result }}
        run: test "$SHARDS" = "success"

  update-visual-baselines:
    # Manual only, on the dispatched ref itself (no inputs). It reads and saves no cache and keeps no
    # token in the checkout. The artifact is a proposal: review every image before committing it.
    if: github.event_name == 'workflow_dispatch'
    name: update-visual-baselines
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --ipc=host

    steps:
      - name: Checkout ${{ github.ref_name }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the image matches @playwright/test
        run: test "$(pnpm exec playwright --version)" = "Version 1.64.0"

      - name: Build
        run: pnpm build

      # The only job allowed to write snapshots (see playwright.config.ts). Nothing is committed.
      - name: Render Linux baselines
        env:
          E2E_RENDER_BASELINES: "1"
        run: pnpm exec playwright test --grep @visual --update-snapshots=all

      - name: Upload Linux baselines for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-visual-baselines-${{ github.sha }}
          path: e2e/__screenshots__/**/*-linux.png
          if-no-files-found: error
          retention-days: 14
