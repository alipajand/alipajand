<style>
  :root {
    --ink: #0f0f0e;
    --ink-2: #1b1b19;
    --bone: #d8d8d3;
    --bone-2: #c9c9c3;
    --line: #ecece6;
    --rule: #5b5b56;
    --mute: #a3a39c;
    --mute-ink: #4b4b46;
    --display: "Archivo", "Arial Black", "Helvetica Neue", Arial, sans-serif;
    --sans: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --gutter-l: max(16px, env(safe-area-inset-left, 0px));
    --gutter-r: max(16px, env(safe-area-inset-right, 0px));
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--ink); }
  body { background: var(--ink); color: var(--line); font-family: var(--sans); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: clip; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--line); outline-offset: 3px; }
  .frame { padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
  .shell { border-left: 1px solid var(--rule); border-right: 1px solid var(--rule); container-type: inline-size; }
  .mono { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
  .mute { color: var(--mute); }
  canvas { display: block; }
  .chev { display: inline-flex; overflow: hidden; width: 40px; flex: none; }
  .chev svg { flex: none; width: 40px; height: 16px; transition: transform .45s cubic-bezier(.6, .05, .2, 1); }
  .chev path { fill: none; stroke: currentColor; stroke-width: 2.2; }
  a:hover .chev svg, a:focus-visible .chev svg { transform: translateX(8px); }

  /* ── Nav ── */
  .nav { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto auto; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); margin-top: 16px; }
  .nav > * { border-right: 1px solid var(--rule); min-height: 56px; display: flex; align-items: center; }
  .nav > *:nth-child(3) { border-right: 0; }
  .nav__name { padding-inline: 16px; font-size: 15px; letter-spacing: .12em; text-transform: uppercase; font-weight: 500; text-decoration: none; }
  .nav__links { gap: 22px; padding-inline: 20px; }
  .nav__links a { text-decoration: none; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; }
  .nav__links a:hover { text-decoration: underline; text-underline-offset: 5px; }
  .nav__links a[aria-current] { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 5px; }
  .nav__cta { display: grid; grid-template-rows: 1fr 1fr; align-items: stretch; min-width: 200px; }
  .nav__cta > * { display: flex; align-items: center; justify-content: center; padding-inline: 18px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; text-decoration: none; }
  .nav__cta > :first-child { border-bottom: 1px solid var(--rule); color: var(--mute); }
  .nav__cta a { transition: background .25s, color .25s; }
  .nav__cta a:hover { background: var(--line); color: var(--ink); }
  .progress { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; min-height: 0 !important; border: 0 !important; background: var(--line); transform-origin: left; transform: scaleX(var(--p, 0)); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); margin-right: 9px; animation: blink 2.4s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .25; } }

  /* ── Display ── */
  .name {
    margin: 0;
    padding: clamp(16px, 2.6vw, 34px) clamp(10px, 2vw, 24px) clamp(12px, 2vw, 26px);
    border-bottom: 1px solid var(--rule);
    display: flex; align-items: center; justify-content: space-between; gap: .15em;
    overflow: hidden;
    font-family: var(--display); font-weight: 800; font-stretch: 125%;
    font-size: 11.6cqi; line-height: .82; letter-spacing: -.015em;
    text-transform: uppercase; white-space: nowrap;
  }
  .name > span { display: block; will-change: transform; }
  .name .star { width: .38em; height: .38em; flex: none; }

  /* ── Ticker ── */
  .ticker { overflow: hidden; border-bottom: 1px solid var(--rule); padding-block: 9px; }
  .ticker__track { display: flex; width: max-content; will-change: transform; }
  .ticker__run { display: flex; align-items: center; gap: 18px; padding-right: 18px; white-space: nowrap; font-style: italic; font-size: 15px; }
  .ticker__run .sep { font-style: normal; color: var(--mute); }
  .ticker__run svg { width: 14px; height: 14px; flex: none; }

  /* ── Section heads ── */
  .head { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 34px 24px 18px; border-bottom: 1px solid var(--rule); }
  .head h2 { margin: 0; min-width: 0; max-width: 100%; font-family: var(--display); font-weight: 800; font-stretch: 125%; text-transform: uppercase; font-size: clamp(34px, 5.4vw, 88px); line-height: .9; text-wrap: balance; }
  .head p { margin: 0; color: var(--mute); max-width: 52ch; }
  .head a { text-decoration: none; display: inline-flex; gap: 10px; align-items: center; }
  .head a:hover { text-decoration: underline; text-underline-offset: 5px; }

  /* ── Light band ── */
  .band { background: var(--bone); color: var(--ink); }
  .band .shell { border-color: var(--bone-2); }
  .band .mono { color: var(--mute-ink); }
  .chevrons { display: flex; align-items: center; overflow: hidden; padding: 10px 12px; border-top: 1px solid var(--ink); }
  .chevrons svg { flex: none; width: clamp(40px, 5vw, 76px); height: auto; transition: opacity .3s, transform .3s; }
  .chevrons svg path { fill: none; stroke: var(--ink); stroke-width: 7; }
  .chevrons svg.off { opacity: .16; transform: translateX(-6px); }

  /* ── Next links + footer ── */
  .next { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: 1px solid var(--rule); }
  .next a { display: flex; flex-direction: column; gap: 22px; padding: 22px 24px; border-right: 1px solid var(--rule); text-decoration: none; transition: background .3s, color .3s; }
  .next a:last-child { border-right: 0; }
  .next a .mono { color: var(--mute); transition: color .3s; }
  .next a strong { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-family: var(--display); font-stretch: 118%; font-weight: 800; text-transform: uppercase; font-size: clamp(20px, 2vw, 30px); line-height: 1; }
  .next a:hover, .next a:focus-visible { background: var(--line); color: var(--ink); }
  .next a:hover .mono, .next a:focus-visible .mono { color: var(--mute-ink); }
  .next a:focus-visible { outline-offset: -4px; outline-color: var(--ink); }
  .foot { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: 1px solid var(--rule); margin-bottom: 16px; }
  .foot > * { padding: 14px 24px; border-right: 1px solid var(--rule); color: var(--mute); }
  .foot > *:last-child { border-right: 0; text-align: right; }

  @media (max-width: 760px) {
    .nav { grid-template-columns: minmax(0, 1fr) auto; }
    .nav > *:nth-child(2) { border-right: 0; }
    .nav__links { grid-column: 1 / -1; grid-row: 2; border-top: 1px solid var(--rule); min-height: 46px; justify-content: space-between; gap: 8px; padding-inline: 16px; }
    .nav__links a { font-size: 12px; letter-spacing: .06em; white-space: nowrap; }
    .nav__cta { min-width: 0; border-right: 0 !important; }
    .nav__cta > * { padding-inline: 12px; }
    .nav__name { padding-inline: 12px; font-size: 13px; }
    .name { padding-inline: 10px; }
    .head { padding-inline: 16px; }
    .head h2 { font-size: min(34px, 9cqi); }
    .next { grid-template-columns: minmax(0, 1fr); }
    .next a { border-right: 0; border-bottom: 1px solid var(--rule); padding: 20px 16px; }
    .next a:last-child { border-bottom: 0; }
    .foot { grid-template-columns: minmax(0, 1fr); }
    .foot > * { border-right: 0; border-bottom: 1px solid var(--rule); padding-inline: 16px; text-align: left !important; }
    .foot > *:last-child { border-bottom: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .ticker__run[aria-hidden] { display: none; }
    .ticker__track { width: auto; }
    .ticker__run { white-space: normal; flex-wrap: wrap; row-gap: 4px; }
  }
  /* ── Diagrams (layers, compare, flow) ── */
  .dg { margin: 0; min-width: 0; }
  .dg__head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--mute); margin-bottom: 14px; }
  .dg__cap { margin: 14px 0 0; color: var(--mute); font-size: 15px; line-height: 1.5; max-width: 70ch; }

  .layers { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .layers li { display: grid; grid-template-columns: 40px minmax(0, 5fr) minmax(0, 7fr); gap: 12px; align-items: baseline; padding: 14px 16px; border: 1px solid var(--rule); transition: background .4s, color .4s; }
  .layers li:nth-child(2) { margin-inline: 2%; } .layers li:nth-child(3) { margin-inline: 4%; } .layers li:nth-child(4) { margin-inline: 6%; } .layers li:nth-child(n+5) { margin-inline: 8%; }
  .layers li:last-child { border-style: dashed; }
  .layers b { font-weight: 600; font-size: 17px; }
  .layers span { color: var(--mute); font-size: 15px; line-height: 1.45; transition: color .4s; }
  .layers .mono { padding-top: 2px; }
  .layers li.on { background: var(--line); color: var(--ink); }
  .layers li.on span { color: var(--mute-ink); }

  .compare { display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); border: 1px solid var(--rule); }
  .compare > div { min-width: 0; border-right: 1px solid var(--rule); }
  .compare > div:last-child { border-right: 0; }
  .compare h4 { margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--rule); font-family: var(--mono); font-weight: 500; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
  .compare > div:last-child h4 { background: var(--line); color: var(--ink); }
  .compare ul { list-style: none; margin: 0; padding: 0; }
  .compare li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 6px; padding: 12px 16px; border-bottom: 1px solid var(--ink-2); font-size: 15px; line-height: 1.5; }
  .compare li:last-child { border-bottom: 0; }
  .compare > div:not(:last-child) li { color: var(--mute); }
  .compare > div:not(:last-child) li::before { content: "×"; font-family: var(--mono); }
  .compare > div:last-child li::before { content: "✓"; font-family: var(--mono); }

  /* The flow always sits on bone. Steps become columns when the figure is wide enough. */
  .dg--flow { background: var(--bone); color: var(--ink); container-type: inline-size; }
  .dg--flow .mono { color: var(--mute-ink); }
  .dg__band-head { display: grid; gap: 10px; padding: 26px 24px 18px; border-bottom: 1px solid var(--ink); }
  .dg__title { font-family: var(--display); font-weight: 800; font-stretch: 120%; text-transform: uppercase; font-size: clamp(24px, 5.2cqi, 68px); line-height: .9; text-wrap: balance; }
  .flow { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); }
  .flow li { padding: 16px 20px; border-bottom: 1px solid var(--ink); display: grid; grid-template-columns: 76px minmax(0, 1fr); column-gap: 12px; row-gap: 8px; align-content: start; transition: background .4s, color .4s; }
  .flow li:last-child { border-bottom: 0; }
  .flow li .mono { grid-row: span 2; padding-top: 4px; }
  .flow li b { font-family: var(--display); font-weight: 800; font-stretch: 118%; text-transform: uppercase; font-size: clamp(19px, 2.4cqi, 30px); line-height: 1; min-width: 0; overflow-wrap: break-word; }
  .flow li p { margin: 0; font-size: 15px; line-height: 1.5; }
  .flow li.on { background: var(--ink); color: var(--line); }
  .flow li.on .mono { color: var(--mute); }
  .flow li.done .mono::after { content: " ✓"; }
  @container (min-width: 1000px) {
    .flow { grid-template-columns: repeat(var(--steps, 5), minmax(0, 1fr)); }
    .flow li { grid-template-columns: minmax(0, 1fr); padding: 20px 20px 24px; border-bottom: 0; border-right: 1px solid var(--ink); }
    .flow li:last-child { border-right: 0; }
    .flow li .mono { grid-row: auto; padding-top: 0; }
  }
  .flow__loop { display: flex; gap: 12px; align-items: center; padding: 14px 24px; border-top: 1px solid var(--ink); font-size: 15px; }
  .flow__loop svg { width: 22px; height: 22px; flex: none; }
  .flow__loop svg path { fill: none; stroke: currentColor; stroke-width: 1.6; }
  .flow__cap { margin: 0; padding: 0 24px 18px; font-size: 15px; color: var(--mute-ink); max-width: 80ch; }
  .flow__loop + .flow__cap { padding-top: 0; }
  .flow + .flow__cap { padding-top: 16px; border-top: 1px solid var(--ink); }

  @media (max-width: 760px) {
    .layers li { grid-template-columns: 30px minmax(0, 1fr); margin-inline: 0 !important; }
    .layers li > span:last-child:not(.mono) { grid-column: 2; }
    .compare { grid-template-columns: minmax(0, 1fr); }
    .compare > div { border-right: 0; border-bottom: 1px solid var(--rule); }
    .compare > div:last-child { border-bottom: 0; }
    .dg__band-head { padding: 22px 16px 16px; }
    .flow li { padding: 16px; grid-template-columns: 66px minmax(0, 1fr); }
    .flow__loop { padding: 14px 16px; }
    .flow__cap { padding: 0 16px 16px; }
  }

  /* Layout: display word over a week ruler for the year with a cursor on this week, then the snapshot
     sections as numbered hairline cells. The stack runs as a ticker on the light band and stays listed below it. */
  .crumbs { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 24px; border-bottom: 1px solid var(--rule); color: var(--mute); }
  .crumbs a { text-decoration: none; }
  .crumbs a:hover { color: var(--line); text-decoration: underline; text-underline-offset: 4px; }
  .crumbs [aria-current] { color: var(--line); }
  .name { font-size: 12.6cqi; }

  .intro { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 8fr); border-bottom: 1px solid var(--rule); }
  .intro__over { padding: 22px 24px; border-right: 1px solid var(--rule); display: grid; gap: 10px; align-content: start; }
  .intro__over .mono { color: var(--mute); }
  .intro__over strong { font-family: var(--display); font-weight: 800; font-stretch: 125%; text-transform: uppercase; font-size: clamp(22px, 2.4vw, 34px); line-height: 1; }
  .intro p { margin: 0; padding: 22px 24px; font-size: clamp(20px, 2vw, 30px); line-height: 1.35; max-width: 36ch; text-wrap: balance; }

  .ruler { position: relative; border-bottom: 1px solid var(--rule); }
  .ruler canvas { width: 100%; height: 132px; }
  .ruler__label { position: absolute; top: 14px; left: 0; padding: 4px 8px; background: var(--line); color: var(--ink); white-space: nowrap; transform: translateX(-50%); pointer-events: none; }

  .cells { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-bottom: 1px solid var(--rule); }
  .cell { display: grid; grid-template-rows: auto auto 1fr auto; gap: 16px; padding: 24px; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); min-width: 0; transition: background .35s; }
  .cell:nth-child(2n) { border-right: 0; }
  .cell:nth-last-child(-n+2):nth-child(odd), .cell:last-child { border-bottom: 0; }
  .cell__n { color: var(--mute); }
  .cell h2 { margin: 0; font-family: var(--display); font-weight: 800; font-stretch: 125%; text-transform: uppercase; font-size: clamp(30px, 4cqi, 60px); line-height: .9; }
  .cell ul { list-style: none; margin: 0; padding: 0; display: grid; border-top: 1px solid var(--rule); }
  .cell li { padding: 12px 0; border-bottom: 1px solid var(--rule); font-size: 17px; line-height: 1.55; display: grid; grid-template-columns: 28px minmax(0, 1fr); }
  .cell li::before { content: "—"; color: var(--mute); }
  .cell a { justify-self: start; display: inline-flex; gap: 10px; align-items: center; text-decoration: none; }
  .cell a:hover { text-decoration: underline; text-underline-offset: 5px; }
  .cell.on { background: var(--ink-2); }

  .band__in { border-left: 1px solid var(--bone-2); border-right: 1px solid var(--bone-2); }
  .shell > .band { margin-left: calc(-1 * var(--gutter-l) - 1px); margin-right: calc(-1 * var(--gutter-r) - 1px); padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
  .stack__head { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; padding: 26px 24px 16px; border-bottom: 1px solid var(--ink); }
  .stack__head h2 { margin: 0; font-family: var(--display); font-weight: 800; font-stretch: 125%; text-transform: uppercase; font-size: clamp(30px, 5.6cqi, 88px); line-height: .9; }
  .band .ticker { border-color: var(--ink); }
  .band .ticker__run { font-family: var(--display); font-style: normal; font-weight: 800; font-stretch: 118%; text-transform: uppercase; font-size: clamp(28px, 4.4cqi, 64px); gap: 26px; padding-right: 26px; }
  .band .ticker__run svg { width: .4em; height: .4em; }
  .stack__list { list-style: none; margin: 0; padding: 16px 24px 20px; display: flex; flex-wrap: wrap; gap: 6px; border-top: 1px solid var(--ink); }
  .stack__list li { font-family: var(--mono); font-size: 12px; letter-spacing: .04em; border: 1px solid var(--ink); padding: 3px 9px; border-radius: 99px; }

  @media (max-width: 760px) {
    .crumbs { padding-inline: 16px; }
    .intro, .cells { grid-template-columns: minmax(0, 1fr); }
    .intro__over { border-right: 0; border-bottom: 1px solid var(--rule); padding: 18px 16px; }
    .intro p { padding: 18px 16px; }
    .cell { border-right: 0; padding: 20px 16px; }
    .cell:nth-last-child(-n+2):nth-child(odd) { border-bottom: 1px solid var(--rule); }
    .cell h2 { font-size: 10cqi; }
    .ruler canvas { height: 110px; }
    .stack__head { padding: 22px 16px 14px; }
    .stack__list { padding: 14px 16px 18px; }
  }
</style>

<script>
(() => {
  // Titles always stay inside the page. Each title is measured at its CSS size and scaled down when
  // its longest word would run past its box; `data-grow` also lets a title scale up to fill its row
  // (case study display words), capped at 1.5× and 16% of the row width.
  const TITLES = ".name, [data-fit], h1, h2, h3, .next strong, .pager strong";
  const measure = (el, cs) => {
    if (el.classList.contains("name") && el.children.length) {
      const kids = [...el.children], gap = parseFloat(cs.columnGap) || 0;
      return kids.reduce((w, k) => w + parseFloat(getComputedStyle(k).width), 0) + gap * (kids.length - 1);
    }
    // Measure with word breaking off, so a word too long for the box shows as overflow.
    el.style.overflowWrap = "normal";
    const used = el.scrollWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    el.style.overflowWrap = "";
    return used;
  };
  const fit = (el) => {
    el.style.removeProperty("font-size");
    const grow = el.hasAttribute("data-grow");
    for (let i = 0; i < 4; i++) {
      const cs = getComputedStyle(el);
      const room = el.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      const used = measure(el, cs);
      if (room <= 0 || used <= 0) return;
      if (!grow && used <= room + 0.5) return;
      const scale = Math.min(grow ? 1.5 : 1, (room / used) * 0.97);
      const size = parseFloat(cs.fontSize) * scale;
      el.style.fontSize = `${(grow ? Math.min(size, el.clientWidth * 0.16) : size).toFixed(1)}px`;
      if (grow) return;
    }
  };
  const fitAll = () => document.querySelectorAll(TITLES).forEach(fit);
  fitAll();
  document.fonts?.ready.then(fitAll);
  document.fonts?.addEventListener?.("loadingdone", fitAll);
  addEventListener("resize", fitAll);
  // Pages that render content or swap a title's text after load (the reader, portfolio scenes) refit.
  let queued = false;
  new MutationObserver((records) => {
    const changed = records.some((r) => (r.target.nodeType === 1 && r.target.matches(TITLES)) || [...r.addedNodes].some((n) => n.nodeType === 1));
    if (queued || !changed) return;
    queued = true;
    requestAnimationFrame(() => { queued = false; fitAll(); });
  }).observe(document.body, { childList: true, subtree: true });
})();
</script>
