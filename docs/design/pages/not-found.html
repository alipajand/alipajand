  /* The flow always sits on bone. Steps become columns when the figure is wide enough. */
  .dg--flow { background: var(--bone); color: var(--ink); container-type: inline-size; }

  .dg__band-head { display: grid; gap: 10px; padding: 26px 24px 18px; border-bottom: 1px solid var(--ink); }

  @container (min-width: 1000px) {

  .flow + .flow__cap { padding-top: 16px; border-top: 1px solid var(--ink); }

  @media (max-width: 760px) {
    .layers li { grid-template-columns: 30px minmax(0, 1fr); margin-inline: 0 !important; }
    .layers li > span:last-child:not(.mono) { grid-column: 2; }
    .compare { grid-template-columns: minmax(0, 1fr); }
    .compare > div { border-right: 0; border-bottom: 1px solid var(--rule); }
    .compare > div:last-child { border-bottom: 0; }
    .dg__band-head { padding: 22px 16px 16px; }
    .flow li { padding: 16px; grid-template-columns: 66px minmax(0, 1fr); }
    .flow__loop { padding: 14px 16px; }
    .flow__cap { padding: 0 16px 16px; }
  }

  /* Layout: the status code as the display, drawn as a route line with one missing segment that follows the
     pointer, then the message and two boxed ways back. Focus moves into the main region on load. */
  .code { position: relative; border-bottom: 1px solid var(--rule); }
  .code b { display: block; padding: 10px 24px 0; font-family: var(--display); font-weight: 900; font-stretch: 125%; font-size: 24cqi; line-height: .8; letter-spacing: -.02em; text-align: center; font-variant-numeric: tabular-nums; }
  .code canvas { width: 100%; height: 120px; }
  main { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); border-bottom: 1px solid var(--rule); outline: none; }
  .msg { padding: 28px 24px; border-right: 1px solid var(--rule); display: grid; gap: 16px; align-content: start; }
  .msg .mono { color: var(--mute); }
  .msg h1 { margin: 0; font-family: var(--display); font-weight: 800; font-stretch: 125%; text-transform: uppercase; font-size: clamp(34px, 5cqi, 76px); line-height: .9; }
  .msg p { margin: 0; font-size: clamp(18px, 1.6vw, 22px); line-height: 1.5; max-width: 46ch; }
  .msg small { color: var(--mute); font-size: 14px; line-height: 1.5; max-width: 52ch; }
  .ways { display: grid; grid-template-rows: 1fr 1fr; }
  .ways a { display: flex; justify-content: space-between; align-items: end; gap: 12px; padding: 22px 24px; text-decoration: none; font-family: var(--display); font-weight: 800; font-stretch: 125%; text-transform: uppercase; font-size: clamp(28px, 3.6cqi, 56px); line-height: .9; transition: background .3s, color .3s; }
  .ways a:first-child { border-bottom: 1px solid var(--rule); }
  .ways a span.mono { font-family: var(--mono); font-weight: 400; font-stretch: 100%; align-self: start; color: var(--mute); }
  .ways a:hover, .ways a:focus-visible { background: var(--line); color: var(--ink); }
  .ways a:hover span.mono, .ways a:focus-visible span.mono { color: var(--mute-ink); }

  @media (max-width: 760px) {

<script>
(() => {
  // Shared motion: tickers react to scroll velocity, the display words part on load and close as you scroll,
  // chevrons light with progress, and the nav hairline tracks the page. Pages add their own work per frame.
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const LINE = "236,236,230";
  const pad = (i) => String(i + 1).padStart(2, "0");
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const fitCanvas = (c) => {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    const w = c.clientWidth, h = c.clientHeight;
    if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
    const ctx = c.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { ctx, w, h };
  };
  const runPortal = (onFrame) => {
    const tracks = [...document.querySelectorAll(".ticker__track")].map((el) => ({ el, dir: +el.dataset.dir, x: 0 }));
    const name = document.querySelector(".name[data-part]");
    const chevrons = [...document.querySelectorAll("#chevrons svg")];
    const chevBand = document.getElementById("chevrons");
    const progress = document.getElementById("progress");
    let lastY = scrollY, vel = 0;
    const frame = (time) => {
      const y = scrollY, vh = innerHeight;
      vel += ((y - lastY) - vel) * .18; lastY = y;
      const max = document.documentElement.scrollHeight - vh;
      progress.style.setProperty("--p", (max > 0 ? y / max : 0).toFixed(4));
      tracks.forEach((tr) => {
        const half = tr.el.scrollWidth / 2;
        tr.x -= (0.45 + Math.abs(vel) * .35) * tr.dir * (vel < -0.5 ? -1 : 1);
        if (tr.x <= -half) tr.x += half;
        if (tr.x > 0) tr.x -= half;
        tr.el.style.transform = `translate3d(${tr.x.toFixed(1)}px,0,0)`;
      });
      if (name) {
        const [w1, star, w2] = name.children;
        const cs = getComputedStyle(name);
        const free = name.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - w1.offsetWidth - w2.offsetWidth - star.getBoundingClientRect().width;
        const shift = (1 - clamp(y / (vh * .6), 0, 1)) * Math.max(0, free) * .42;
        w1.style.transform = `translateX(${shift.toFixed(1)}px)`;
        w2.style.transform = `translateX(${(-shift).toFixed(1)}px)`;
        star.style.transform = `rotate(${(y * .35).toFixed(1)}deg)`;
      }
      if (chevBand) {
        const cr = chevBand.getBoundingClientRect();
        const lit = Math.round(clamp((vh - cr.top) / (vh * .75), 0, 1) * chevrons.length);
        chevrons.forEach((c, i) => c.classList.toggle("off", i >= lit));
      }
      onFrame(time, { y, vh, vel });
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  };
