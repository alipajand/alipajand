<title>TallyFolio Case Study</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Geist+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ink: #0f0f0e;
    --ink-2: #1b1b19;
    --bone: #d8d8d3;
    --bone-2: #c9c9c3;
    --line: #ecece6;
    --rule: #5b5b56;
    --mute: #a3a39c;
    --mute-ink: #4b4b46;
    --display: "Archivo", "Arial Black", "Helvetica Neue", Arial, sans-serif;
    --sans: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --gutter-l: max(16px, env(safe-area-inset-left, 0px));
    --gutter-r: max(16px, env(safe-area-inset-right, 0px));
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--ink); }
  body { background: var(--ink); color: var(--line); font-family: var(--sans); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: clip; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--line); outline-offset: 3px; }
  .frame { padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
  .shell { border-left: 1px solid var(--rule); border-right: 1px solid var(--rule); container-type: inline-size; }
  .mono { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
  .mute { color: var(--mute); }
  canvas { display: block; }
  .chev { display: inline-flex; overflow: hidden; width: 40px; flex: none; }
  .chev svg { flex: none; width: 40px; height: 16px; transition: transform .45s cubic-bezier(.6, .05, .2, 1); }
  .chev path { fill: none; stroke: currentColor; stroke-width: 2.2; }
  a:hover .chev svg, a:focus-visible .chev svg { transform: translateX(8px); }

  /* ── Nav ── */
  .nav { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto auto; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); margin-top: 16px; }
  .nav > * { border-right: 1px solid var(--rule); min-height: 56px; display: flex; align-items: center; }
  .nav > *:nth-child(3) { border-right: 0; }
  .nav__name { padding-inline: 16px; font-size: 15px; letter-spacing: .12em; text-transform: uppercase; font-weight: 500; text-decoration: none; }
  .nav__links { gap: 22px; padding-inline: 20px; }
  .nav__links a { text-decoration: none; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; }
  .nav__links a:hover { text-decoration: underline; text-underline-offset: 5px; }
  .nav__links a[aria-current] { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 5px; }
  .nav__cta { display: grid; grid-template-rows: 1fr 1fr; align-items: stretch; min-width: 200px; }
  .nav__cta > * { display: flex; align-items: center; justify-content: center; padding-inline: 18px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; text-decoration: none; }
  .nav__cta > :first-child { border-bottom: 1px solid var(--rule); color: var(--mute); }
  .nav__cta a { transition: background .25s, color .25s; }
  .nav__cta a:hover { background: var(--line); color: var(--ink); }
  .progress { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; min-height: 0 !important; border: 0 !important; background: var(--line); transform-origin: left; transform: scaleX(var(--p, 0)); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); margin-right: 9px; animation: blink 2.4s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .25; } }

  /* ── Display ── */
  .name {
    margin: 0;
    padding: clamp(16px, 2.6vw, 34px) clamp(10px, 2vw, 24px) clamp(12px, 2vw, 26px);
    border-bottom: 1px solid var(--rule);
    display: flex; align-items: center; justify-content: space-between; gap: .15em;
    overflow: hidden;
    font-family: var(--display); font-weight: 800; font-stretch: 125%;
    font-size: 11.6cqi; line-height: .82; letter-spacing: -.015em;
    text-transform: uppercase; white-space: nowrap;
  }
  .name > span { display: block; will-change: transform; }
  .name .star { width: .38em; height: .38em; flex: none; }

  /* ── Ticker ── */
  .ticker { overflow: hidden; border-bottom: 1px solid var(--rule); padding-block: 9px; }
  .ticker__track { display: flex; width: max-content; will-change: transform; }
  .ticker__run { display: flex; align-items: center; gap: 18px; padding-right: 18px; white-space: nowrap; font-style: italic; font-size: 15px; }
  .ticker__run .sep { font-style: normal; color: var(--mute); }
  .ticker__run svg { width: 14px; height: 14px; flex: none; }

  /* ── Section heads ── */
  .head { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 34px 24px 18px; border-bottom: 1px solid var(--rule); }
  .head h2 { margin: 0; min-width: 0; max-width: 100%; font-family: var(--display); font-weight: 800; font-stretch: 125%; text-transform: uppercase; font-size: clamp(34px, 5.4vw, 88px); line-height: .9; text-wrap: balance; }
  .head p { margin: 0; color: var(--mute); max-width: 52ch; }
  .head a { text-decoration: none; display: inline-flex; gap: 10px; align-items: center; }
  .head a:hover { text-decoration: underline; text-underline-offset: 5px; }

  /* ── Light band ── */
  .band { background: var(--bone); color: var(--ink); }
  .band .shell { border-color: var(--bone-2); }
  .band .mono { color: var(--mute-ink); }
  .chevrons { display: flex; align-items: center; overflow: hidden; padding: 10px 12px; border-top: 1px solid var(--ink); }
  .chevrons svg { flex: none; width: clamp(40px, 5vw, 76px); height: auto; transition: opacity .3s, transform .3s; }
  .chevrons svg path { fill: none; stroke: var(--ink); stroke-width: 7; }
  .chevrons svg.off { opacity: .16; transform: translateX(-6px); }

  /* ── Next links + footer ── */
  .next { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: 1px solid var(--rule); }
  .next a { display: flex; flex-direction: column; gap: 22px; padding: 22px 24px; border-right: 1px solid var(--rule); text-decoration: none; transition: background .3s, color .3s; }
  .next a:last-child { border-right: 0; }
  .next a .mono { color: var(--mute); transition: color .3s; }
  .next a strong { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-family: var(--display); font-stretch: 118%; font-weight: 800; text-transform: uppercase; font-size: clamp(20px, 2vw, 30px); line-height: 1; }
  .next a:hover, .next a:focus-visible { background: var(--line); color: var(--ink); }
  .next a:hover .mono, .next a:focus-visible .mono { color: var(--mute-ink); }
  .next a:focus-visible { outline-offset: -4px; outline-color: var(--ink); }
  .foot { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: 1px solid var(--rule); margin-bottom: 16px; }
  .foot > * { padding: 14px 24px; border-right: 1px solid var(--rule); color: var(--mute); }
  .foot > *:last-child { border-right: 0; text-align: right; }

  @media (max-width: 760px) {
    .nav { grid-template-columns: minmax(0, 1fr) auto; }
    .nav > *:nth-child(2) { border-right: 0; }
    .nav__links { grid-column: 1 / -1; grid-row: 2; border-top: 1px solid var(--rule); min-height: 46px; justify-content: space-between; gap: 8px; padding-inline: 16px; }
    .nav__links a { font-size: 12px; letter-spacing: .06em; white-space: nowrap; }
    .nav__cta { min-width: 0; border-right: 0 !important; }
    .nav__cta > * { padding-inline: 12px; }
    .nav__name { padding-inline: 12px; font-size: 13px; }
    .name { padding-inline: 10px; }
    .head { padding-inline: 16px; }
    .head h2 { font-size: min(34px, 9cqi); }
    .next { grid-template-columns: minmax(0, 1fr); }
    .next a { border-right: 0; border-bottom: 1px solid var(--rule); padding: 20px 16px; }
    .next a:last-child { border-bottom: 0; }
    .foot { grid-template-columns: minmax(0, 1fr); }
    .foot > * { border-right: 0; border-bottom: 1px solid var(--rule); padding-inline: 16px; text-align: left !important; }
    .foot > *:last-child { border-bottom: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .ticker__run[aria-hidden] { display: none; }
    .ticker__track { width: auto; }
    .ticker__run { white-space: normal; flex-wrap: wrap; row-gap: 4px; }
  }
  /* ── Diagrams (layers, compare, flow) ── */
  .dg { margin: 0; min-width: 0; }
  .dg__head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--mute); margin-bottom: 14px; }
  .dg__cap { margin: 14px 0 0; color: var(--mute); font-size: 15px; line-height: 1.5; max-width: 70ch; }

  .layers { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .layers li { display: grid; grid-template-columns: 40px minmax(0, 5fr) minmax(0, 7fr); gap: 12px; align-items: baseline; padding: 14px 16px; border: 1px solid var(--rule); transition: background .4s, color .4s; }
  .layers li:nth-child(2) { margin-inline: 2%; } .layers li:nth-child(3) { margin-inline: 4%; } .layers li:nth-child(4) { margin-inline: 6%; } .layers li:nth-child(n+5) { margin-inline: 8%; }
  .layers li:last-child { border-style: dashed; }
  .layers b { font-weight: 600; font-size: 17px; }
  .layers span { color: var(--mute); font-size: 15px; line-height: 1.45; transition: color .4s; }
  .layers .mono { padding-top: 2px; }
  .layers li.on { background: var(--line); color: var(--ink); }
  .layers li.on span { color: var(--mute-ink); }

  .compare { display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); border: 1px solid var(--rule); }
  .compare > div { min-width: 0; border-right: 1px solid var(--rule); }
  .compare > div:last-child { border-right: 0; }
  .compare h4 { margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--rule); font-family: var(--mono); font-weight: 500; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
  .compare > div:last-child h4 { background: var(--line); color: var(--ink); }
  .compare ul { list-style: none; margin: 0; padding: 0; }
  .compare li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 6px; padding: 12px 16px; border-bottom: 1px solid var(--ink-2); font-size: 15px; line-height: 1.5; }
  .compare li:last-child { border-bottom: 0; }
  .compare > div:not(:last-child) li { color: var(--mute); }
  .compare > div:not(:last-child) li::before { content: "×"; font-family: var(--mono); }
  .compare > div:last-child li::before { content: "✓"; font-family: var(--mono); }

  /* The flow always sits on bone. Steps become columns when the figure is wide enough. */
  .dg--flow { background: var(--bone); color: var(--ink); container-type: inline-size; }
  .dg--flow .mono { color: var(--mute-ink); }
  .dg__band-head { display: grid; gap: 10px; padding: 26px 24px 18px; border-bottom: 1px solid var(--ink); }
  .dg__title { font-family: var(--display); font-weight: 800; font-stretch: 120%; text-transform: uppercase; font-size: clamp(24px, 5.2cqi, 68px); line-height: .9; text-wrap: balance; }
  .flow { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); }
  .flow li { padding: 16px 20px; border-bottom: 1px solid var(--ink); display: grid; grid-template-columns: 76px minmax(0, 1fr); column-gap: 12px; row-gap: 8px; align-content: start; transition: background .4s, color .4s; }
  .flow li:last-child { border-bottom: 0; }
  .flow li .mono { grid-row: span 2; padding-top: 4px; }
  .flow li b { font-family: var(--display); font-weight: 800; font-stretch: 118%; text-transform: uppercase; font-size: clamp(19px, 2.4cqi, 30px); line-height: 1; min-width: 0; overflow-wrap: break-word; }
  .flow li p { margin: 0; font-size: 15px; line-height: 1.5; }
  .flow li.on { background: var(--ink); color: var(--line); }
  .flow li.on .mono { color: var(--mute); }
  .flow li.done .mono::after { content: " ✓"; }
  @container (min-width: 1000px) {
    .flow { grid-template-columns: repeat(var(--steps, 5), minmax(0, 1fr)); }
    .flow li { grid-template-columns: minmax(0, 1fr); padding: 20px 20px 24px; border-bottom: 0; border-right: 1px solid var(--ink); }
    .flow li:last-child { border-right: 0; }
    .flow li .mono { grid-row: auto; padding-top: 0; }
  }
  .flow__loop { display: flex; gap: 12px; align-items: center; padding: 14px 24px; border-top: 1px solid var(--ink); font-size: 15px; }
  .flow__loop svg { width: 22px; height: 22px; flex: none; }
  .flow__loop svg path { fill: none; stroke: currentColor; stroke-width: 1.6; }
  .flow__cap { margin: 0; padding: 0 24px 18px; font-size: 15px; color: var(--mute-ink); max-width: 80ch; }
  .flow__loop + .flow__cap { padding-top: 0; }
  .flow + .flow__cap { padding-top: 16px; border-top: 1px solid var(--ink); }

  @media (max-width: 760px) {
    .layers li { grid-template-columns: 30px minmax(0, 1fr); margin-inline: 0 !important; }
    .layers li > span:last-child:not(.mono) { grid-column: 2; }
    .compare { grid-template-columns: minmax(0, 1fr); }
    .compare > div { border-right: 0; border-bottom: 1px solid var(--rule); }
    .compare > div:last-child { border-bottom: 0; }
    .dg__band-head { padding: 22px 16px 16px; }
    .flow li { padding: 16px; grid-template-columns: 66px minmax(0, 1fr); }
    .flow__loop { padding: 14px 16px; }
    .flow__cap { padding: 0 16px 16px; }
  }

  /* Layout: name display, intro beside a framed hero screenshot that flattens on scroll (or beside the facts
     when a project has no screenshots), a sticky chapter rail, then numbered sections. Layers and compare
     diagrams sit inside their section; a flow diagram breaks out into a full-bleed light band after it. */
  .crumbs { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 24px; border-bottom: 1px solid var(--rule); color: var(--mute); }
  .crumbs a { text-decoration: none; }
  .crumbs a:hover { color: var(--line); text-decoration: underline; text-underline-offset: 4px; }
  .crumbs [aria-current] { color: var(--line); }
  .name { font-size: 8.8cqi; }

  .intro { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); border-bottom: 1px solid var(--rule); }
  .intro__copy { padding: 28px 24px; border-right: 1px solid var(--rule); display: flex; flex-direction: column; gap: 20px; }
  .intro__copy .over { color: var(--mute); max-width: 48ch; text-transform: none; letter-spacing: .02em; font-size: 13px; line-height: 1.5; }
  .intro h2 { margin: 0; font-family: var(--display); font-weight: 800; font-stretch: 118%; text-transform: uppercase; font-size: clamp(30px, 3.2vw, 52px); line-height: .92; text-wrap: balance; }
  .intro__overview { margin: 0; font-size: clamp(18px, 1.5vw, 21px); line-height: 1.5; max-width: 52ch; }
  .facts { margin: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); border: 1px solid var(--rule); }
  .facts > div { padding: 10px 12px; display: grid; gap: 4px; border-bottom: 1px solid var(--rule); }
  .facts > div:nth-child(odd) { border-right: 1px solid var(--rule); }
  .facts > div:last-child { grid-column: 1 / -1; border-right: 0; border-bottom: 0; }
  .facts--stack > div { grid-column: 1 / -1; border-right: 0 !important; }
  .intro__meta { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; margin-top: auto; min-width: 0; }
  .intro--plain .intro__meta { margin-top: 0; }
  .facts dt { color: var(--mute); }
  .facts dd { margin: 0; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tags span { font-family: var(--mono); font-size: 12px; letter-spacing: .04em; border: 1px solid var(--rule); padding: 2px 8px; border-radius: 99px; }
  .live { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px; background: var(--line); color: var(--ink); text-decoration: none; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; transition: background .25s; }
  .live:hover { background: var(--bone-2); }
  .live small { font-family: var(--mono); letter-spacing: .02em; text-transform: none; font-size: 13px; margin-left: auto; min-width: 0; overflow-wrap: anywhere; text-align: right; }
  .intro__shot { padding: 28px 24px 22px; display: grid; gap: 14px; align-content: center; perspective: 1400px; overflow: hidden; }

  /* ── Screenshot frame ── */
  .shot { margin: 0; display: grid; gap: 12px; }
  .shot__win { position: relative; border: 1px solid var(--rule); background: var(--ink-2); transform-origin: 50% 100%; will-change: transform; }
  .shot__bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--rule); color: var(--mute); }
  .shot__bar i { width: 7px; height: 7px; border: 1px solid var(--rule); border-radius: 50%; }
  .shot__bar span { margin-left: 6px; }
  .shot__bar b { margin-left: auto; font-weight: 400; }
  .shot button { all: unset; display: block; width: 100%; cursor: zoom-in; }
  .shot button:focus-visible { outline: 2px solid var(--line); outline-offset: 3px; }
  .shot img { display: block; width: 100%; height: auto; aspect-ratio: 1728 / 1084; background: #151515; }
  .shot figcaption { font-size: 15px; line-height: 1.5; color: var(--mute); max-width: 72ch; }
  .shot figcaption b { color: var(--line); font-weight: 600; }

  /* ── Chapter rail ── */
  .rail { position: sticky; top: 0; z-index: 5; background: var(--ink); border-bottom: 1px solid var(--rule); }
  .rail ol { list-style: none; margin: 0; padding: 0; display: flex; overflow-x: auto; scrollbar-width: none; }
  .rail ol::-webkit-scrollbar { display: none; }
  .rail a { display: flex; gap: 8px; padding: 12px 16px; white-space: nowrap; text-decoration: none; border-right: 1px solid var(--rule); transition: background .25s, color .25s; }
  .rail a span { color: var(--mute); }
  .rail a:hover { background: var(--ink-2); }
  .rail a.on { background: var(--line); color: var(--ink); }
  .rail a.on span { color: var(--mute-ink); }
  .rail__p { position: absolute; left: 0; bottom: -1px; height: 2px; width: 100%; background: var(--line); transform-origin: left; transform: scaleX(var(--p, 0)); }

  /* ── Sections ── */
  .sec { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 8fr); border-bottom: 1px solid var(--rule); scroll-margin-top: 50px; }
  .sec__side { border-right: 1px solid var(--rule); }
  .sec__stick { position: sticky; top: 50px; padding: 26px 24px; display: grid; gap: 12px; }
  .sec__n { color: var(--mute); }
  .sec h3 { margin: 0; font-family: var(--display); font-weight: 800; font-stretch: 120%; text-transform: uppercase; font-size: clamp(28px, 3vw, 50px); line-height: .92; text-wrap: balance; }
  .sec__main { min-width: 0; display: grid; align-content: start; }
  .sec__main > * { padding: 26px 24px; border-bottom: 1px solid var(--rule); min-width: 0; }
  .sec__main > *:last-child { border-bottom: 0; }
  .lead { margin: 0; font-size: clamp(19px, 1.6vw, 23px); line-height: 1.5; max-width: 58ch; text-wrap: pretty; }
  .items { list-style: none; margin: 0; padding: 0; display: grid; border: 1px solid var(--rule); }
  .items li { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--rule); font-size: 17px; line-height: 1.55; }
  .items li:last-child { border-bottom: 0; }
  .items li::before { content: attr(data-n); font-family: var(--mono); font-size: 12px; color: var(--mute); padding-top: 4px; }
  .cells { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid var(--rule); }
  .cells li { padding: 18px 16px 20px; border-bottom: 1px solid var(--rule); border-right: 1px solid var(--rule); display: grid; gap: 14px; align-content: start; font-size: 16px; line-height: 1.55; }
  .cells li:nth-child(2n) { border-right: 0; }
  .cells li:last-child { grid-column: 1 / -1; border-right: 0; border-bottom: 0; }
  .cells li::before { content: attr(data-n); font-family: var(--mono); font-size: 12px; color: var(--mute); }

  /* Decisions. */
  .decisions { display: grid; gap: 16px; }
  .dec { border: 1px solid var(--rule); }
  .dec__head { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 10px; padding: 16px; border-bottom: 1px solid var(--rule); }
  .dec__head .mono { color: var(--mute); padding-top: 4px; }
  .dec__head p { margin: 0; font-size: 18px; line-height: 1.45; font-weight: 500; }
  .dec dl { margin: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .dec dl > div { padding: 14px 16px; border-right: 1px solid var(--rule); display: grid; gap: 8px; align-content: start; }
  .dec dl > div:last-child { border-right: 0; }
  .dec dt { color: var(--mute); }
  .dec dd { margin: 0; font-size: 15px; line-height: 1.55; }
  .dec dl > div:last-child dd { color: var(--line); }

  /* ── Flow band ── */
  .band[data-for] { margin-left: calc(-1 * var(--gutter-l) - 1px); margin-right: calc(-1 * var(--gutter-r) - 1px); padding-left: var(--gutter-l); padding-right: var(--gutter-r); scroll-margin-top: 50px; }
  .band__in { border-left: 1px solid var(--bone-2); border-right: 1px solid var(--bone-2); }
  .intro--plain .intro__shot { align-content: start; gap: 18px; }

sed a manual-first import flow instead of requiring bank aggregation so users stay in control of what enters the system.","Modeled subscriptions and recurring schedules as first-class workflows so forecasting stays aligned to schedule truth rather than transaction guesswork.","Kept the product mobile/PWA-friendly for everyday use instead of assuming a desktop-only finance workflow.","Separated asset tracking from everyday spending flows so investment and cash workflows do not blur together in the UI."],"interfaceEvidence":[{"type":"image","src":"/portfolio-media/tallyfolio-landing.png","width":3186,"height":1768,"alt":"TallyFolio landing page","captionLead":"Landing page.","captionBody":"Public landing and support pages introduce the manual-first product positioning before authenticated finance workflows."}],"outcome":["Shipped a live full-stack finance product with privacy-conscious workflows and production-grade auth.","Established deterministic finance logic across budgets, reports, forecasts, subscriptions, investments, and asset tracking.","Created modern import and review workflows without depending on bank aggregation as the product baseline."],"nextImprovements":["Expand more product-level evidence around forecast edge cases, import recovery, and mobile-specific workflow detail.","Continue refining the boundary between deterministic finance output and optional AI explanations as the product grows."],"diagrams":[{"section":"context","spec":{"type":"layers","title":"Where deterministic finance logic ends and AI begins","caption":"AI only explains figures the domain layer has already computed, so financial correctness never depends on model output.","layers":[{"label":"PWA product workflows","detail":"Dashboard, imports, budgets, reports, forecasts, subscriptions, investments, and assets, built for everyday mobile use."},{"label":"Optional AI explanations","detail":"Constrained to explaining already-computed figures, never generating new financial advice."},{"label":"Pure finance domain modules","detail":"Budgets, forecasts, reports, subscriptions, investments, and assets calculated deterministically and testably."},{"label":"Integer minor-unit storage","detail":"Financial values are stored as integer minor units rather than scattered across UI and persistence math."}]}},{"section":"problem","spec":{"type":"compare","title":"Bank aggregation, spreadsheets, and a manual-first product","caption":"TallyFolio is the third option: manual-first and private, with modern product workflows built in.","columns":[{"label":"Bank aggregation","items":["Requires handing over bank credentials","Product workflows depend on aggregation as the baseline"]},{"label":"Spreadsheets","items":["Manual and private, without bank aggregation","Leaves out the modern product workflows people expect"]},{"label":"Manual-first TallyFolio","items":["No bank credentials required","CSV import review before data becomes product state","Subscriptions and recurring schedules drive the forecast","Deterministic totals across budgets, reports, investments, and assets"]}]}},{"section":"technical-decisions","spec":{"type":"flow","title":"Manual-first import review","caption":"Raw files never persist and nothing enters the data model without an explicit review step, which keeps the privacy surface narrow.","steps":[{"label":"Choose file","detail":"The user selects a CSV or XLSX export to import."},{"label":"Parse in memory","detail":"The file is parsed in memory for review. The raw file is not persisted."},{"label":"Review","detail":"The user verifies and categorizes transactions before anything is saved."},{"label":"Save","detail":"Reviewed transactions become product state."},{"label":"Compute","detail":"Budgets, reports, and forecasts recalculate in pure domain modules using integer minor units."}]}}]},"liveLinks":[{"label":"Live product","href":"https://tallyfolio.com"}],"relatedLinks":[]};

    { id: "problem", title: "Problem", blocks: cs.problem && [`<p class="lead">${esc(cs.problem)}</p>`] },
    { id: "role", title: "My role", blocks: cs.myRole?.length && [list(cs.myRole)] },
    { id: "built", title: "What I built", blocks: cs.whatIBuilt?.length && [list(cs.whatIBuilt, "cells")] },
    { id: "technical-decisions", title: "Technical decisions", blocks: cs.technicalDecisions?.length && [`<div class="decisions">${cs.technicalDecisions.map((d, i) => `
      <article class="dec">
        <div class="dec__head"><span class="mono">Decision ${pad(i)}</span><p>${esc(d.decision)}</p></div>
        <dl><div><dt class="mono">Why</dt><dd>${esc(d.why)}</dd></div><div><dt class="mono">Trade-off</dt><dd>${esc(d.tradeOff)}</dd></div><div><dt class="mono">Result</dt><dd>${esc(d.result)}</dd></div></dl>
      </article>`).join("")}</div>`] },
    { id: "ux", title: "UX and detail decisions", blocks: cs.uxDecisions?.length && [list(cs.uxDecisions)] },
    { id: "evidence", title: "Interface evidence", flush: true, blocks: evidence.length > 1 && [`<div class="evidence">${evidence.slice(1).map((f, i) => shot(f, i + 1, f.src.includes("login") ? "shot--side" : "")).join("")}</div>`] },
    { id: "outcome", title: "Outcome", blocks: cs.outcome?.length && [`<ul class="outcome">${cs.outcome.map((x, i) => `<li data-n="${pad(i)}">${esc(x)}</li>`).join("")}</ul>`] },
    { id: "improve", title: "What I would improve", blocks: cs.nextImprovements?.length && [list(cs.nextImprovements)] },
    { id: "related", title: "Related work", blocks: (P.relatedLinks?.length || lives.length) && [`<div class="related">${[...(P.relatedLinks ?? []), ...lives].map((l) => `<a href="${link(l.href)}"><span><small>${esc(l.href.startsWith("/") ? kindOf(l.href) : l.label)}</small>${esc(l.href.startsWith("/") ? l.label : host(l.href))}</span>${chev}</a>`).join("")}</div>`] },
  ].filter((s) => s.blocks);
  // Diagrams attach to the section the data names; flows become a light band after that section.
  const bands = {};
  (cs.diagrams ?? []).forEach(({ section, spec }) => {
    const s = SECTIONS.find((x) => x.id === section);
    if (!s) return;
    if (spec.type === "flow") bands[s.id] = renderDiagram(spec, `Diagram · ${s.title}`);
    else s.blocks.push(renderDiagram(spec));
  });
  $("sections").innerHTML = SECTIONS.map((s, i) => `
    <section class="sec" id="${s.id}" aria-labelledby="${s.id}-t">
      <div class="sec__side"><div class="sec__stick"><span class="sec__n mono">[ ${pad(i)} ]</span><h3 id="${s.id}-t">${esc(s.title)}</h3></div></div>
      <div class="sec__main">${s.flush ? s.blocks.join("") : s.blocks.map((b) => `<div>${b}</div>`).join("")}</div>
    </section>${bands[s.id] ? `
    <section class="band" data-for="${s.id}" aria-label="${esc(s.title)} diagram"><div class="band__in">${bands[s.id]}<div class="chevrons" id="chevrons" aria-hidden="true"><svg viewBox="0 0 40 60"><path d="M6 4 L32 30 L6 56"/></svg><svg viewBox="0 0 40 60"><path d="M6 4 L32 30 L6 56"/></svg><svg viewBox="0 0 40 60"><path d="M6 4 L32 30 L6 56"/></svg><svg viewBox="0 0 40 60"><path d="M6 4 L32 30 L6 56"/></svg><svg viewBox="0 0 40 60"><path d="M6 4 L32 30 L6 56"/></svg><svg viewBox="0 0 40 60"><path d="M6 4 L32 30 L6 56"/></svg><svg viewBox="0 0 40 60"><path d="M6 4 L32 30 L6 56"/></svg><svg viewBox="0 0 40 60"><path d="M6 4 L32 30 L6 56"/></svg><svg viewBox="0 0 40 60"><path d="M6 4 L32 30 L6 56"/></svg><svg viewBox="0 0 40 60"><path d="M6 4 L32 30 L6 56"/></svg><svg viewBox="0 0 40 60"><path d="M6 4 L32 30 L6 56"/></svg><svg viewBox="0 0 40 60"><path d="M6 4 L32 30 L6 56"/></svg></div></div></section>` : ""}`).join("");
  $("rail").innerHTML = SECTIONS.map((s, i) => `<li><a href="#${s.id}"><span class="mono">${pad(i)}</span>${esc(s.title)}</a></li>`).join("");
  if (NEXT) $("pager").insertAdjacentHTML("beforeend", `<a href="${NEXT.href}"><span class="mono">[ Next case study ]</span><strong>${esc(NEXT.name)} ${chev}</strong></a>`);
  else $("pager").classList.add("pager--single");

  // ── Lightbox for every screenshot ──
  const lb = $("lb"), lbImg = $("lb-img"), lbTitle = $("lb-title");
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-shot]");
    if (!b) return;
    const f = evidence[+b.dataset.shot];
    lbImg.src = imgFor(f); lbImg.alt = f.alt; lbTitle.textContent = f.captionLead.replace(/\.$/, "");
    lb.showModal();
  });
  $("lb-close").addEventListener("click", () => lb.close());
  lb.addEventListener("click", (e) => { if (e.target === lb) lb.close(); });

  if (reduce) {
    document.querySelectorAll(".flow li").forEach((li) => li.classList.add("done"));
    return;
  }

  const railLinks = [...document.querySelectorAll("#rail a")];
  const secs = SECTIONS.map((s) => $(s.id));
  const railP = $("rail-p");
  const band = document.querySelector(".band[data-for]");
  const bandIndex = band ? SECTIONS.findIndex((s) => s.id === band.dataset.for) : -1;
  const heroWin = document.querySelector('[data-tilt="1"]');
  const tilt = { x: 0, y: 0, sx: 0, sy: 0 };
  heroWin?.addEventListener("pointermove", (e) => { const r = heroWin.getBoundingClientRect(); tilt.x = (e.clientX - r.left) / r.width - .5; tilt.y = (e.clientY - r.top) / r.height - .5; });
  heroWin?.addEventListener("pointerleave", () => { tilt.x = tilt.y = 0; });
  let lastCur = -1;

  runPortal((time, { y, vh }) => {
    // Hero screenshot starts tipped back and flattens as you scroll into the page.
    if (heroWin) {
      const k = clamp(y / (vh * .55), 0, 1);
      tilt.sx += (tilt.x - tilt.sx) * .08; tilt.sy += (tilt.y - tilt.sy) * .08;
      heroWin.style.transform = `rotateX(${((1 - k) * 14 - tilt.sy * 4).toFixed(2)}deg) rotateY(${(tilt.sx * 5).toFixed(2)}deg) scale(${(.94 + k * .06).toFixed(3)})`;
    }

    // Chapter rail follows the section under the rail; the flow band counts as its section.
    let cur = 0;
    secs.forEach((s, i) => { if (s.getBoundingClientRect().top < vh * .3) cur = i; });
    if (band) { const br = band.getBoundingClientRect(); if (br.top < vh * .3 && br.bottom > vh * .3) cur = bandIndex; }
    if (y + vh >= document.documentElement.scrollHeight - 4) cur = secs.length - 1;
    if (cur !== lastCur) {
      lastCur = cur;
      railLinks.forEach((a, i) => a.classList.toggle("on", i === cur));
      const a = railLinks[cur], ol = a.closest("ol");
      ol.scrollTo({ left: a.offsetLeft - ol.clientWidth / 2 + a.offsetWidth / 2, behavior: "smooth" });
    }
    const first = secs[0].getBoundingClientRect().top + y, last = secs[secs.length - 1].getBoundingClientRect().bottom + y;
    railP.style.setProperty("--p", clamp((y + vh * .3 - first) / (last - first), 0, 1).toFixed(4));

    lightDiagrams(vh);
  });
})();
</script>
<script>
(() => {
  // Titles always stay inside the page. Each title is measured at its CSS size and scaled down when
  // its longest word would run past its box; `data-grow` also lets a title scale up to fill its row
  // (case study display words), capped at 1.5× and 16% of the row width.
  const TITLES = ".name, [data-fit], h1, h2, h3, .next strong, .pager strong";
  const measure = (el, cs) => {
    if (el.classList.contains("name") && el.children.length) {
      const kids = [...el.children], gap = parseFloat(cs.columnGap) || 0;
      return kids.reduce((w, k) => w + parseFloat(getComputedStyle(k).width), 0) + gap * (kids.length - 1);
    }
    // Measure with word breaking off, so a word too long for the box shows as overflow.
    el.style.overflowWrap = "normal";
    const used = el.scrollWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    el.style.overflowWrap = "";
    return used;
  };
  const fit = (el) => {
    el.style.removeProperty("font-size");
    const grow = el.hasAttribute("data-grow");
    for (let i = 0; i < 4; i++) {
      const cs = getComputedStyle(el);
      const room = el.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      const used = measure(el, cs);
      if (room <= 0 || used <= 0) return;
      if (!grow && used <= room + 0.5) return;
      const scale = Math.min(grow ? 1.5 : 1, (room / used) * 0.97);
      const size = parseFloat(cs.fontSize) * scale;
      el.style.fontSize = `${(grow ? Math.min(size, el.clientWidth * 0.16) : size).toFixed(1)}px`;
      if (grow) return;
    }
  };
  const fitAll = () => document.querySelectorAll(TITLES).forEach(fit);
  fitAll();
  document.fonts?.ready.then(fitAll);
  document.fonts?.addEventListener?.("loadingdone", fitAll);
  addEventListener("resize", fitAll);
  // Pages that render content or swap a title's text after load (the reader, portfolio scenes) refit.
  let queued = false;
  new MutationObserver((records) => {
    const changed = records.some((r) => (r.target.nodeType === 1 && r.target.matches(TITLES)) || [...r.addedNodes].some((n) => n.nodeType === 1));
    if (queued || !changed) return;
    queued = true;
    requestAnimationFrame(() => { queued = false; fitAll(); });
  }).observe(document.body, { childList: true, subtree: true });
})();
</script>
