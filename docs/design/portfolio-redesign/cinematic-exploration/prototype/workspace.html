        function DocumentViewer({ sel, fields, failed, onRetry, onBack, viewRef, showBack }) {
          const [zoom, setZoom] = useState("fit");
          const [page, setPage] = useState(1);
          const scrollRef = useRef(null);
          const f = fields.find((x) => x.key === sel);
          const activeEx = f && f.ex;
          useEffect(() => {
            const box = scrollRef.current;
            if (!box || !f) return;
            const target = activeEx
              ? box.querySelector("mark.is-active")
              : f.page
                ? box.querySelector('[data-page="' + f.page + '"]')
                : null;
            if (!target) return;
            const canScroll =
              box.scrollHeight > box.clientHeight + 4 &&
              getComputedStyle(box).overflowY !== "visible";
            if (canScroll) {
              const top =
                target.getBoundingClientRect().top -
                box.getBoundingClientRect().top +
                box.scrollTop -
                box.clientHeight / 3;
              box.scrollTo({
                top,
                behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches
                  ? "auto"
                  : "smooth",
              });
            } else if (getComputedStyle(box.closest(".pane")).display !== "none")
              target.scrollIntoView({ block: "center" });
            setPage(f.page || 1);
          }, [sel, viewRef]);
          const onScroll = () => {
            const box = scrollRef.current;
            if (!box) return;
            const pages = [...box.querySelectorAll(".page")];
            const mid = box.getBoundingClientRect().top + 60;
            const cur = pages.findIndex((p) => p.getBoundingClientRect().bottom > mid);
            setPage(cur < 0 ? pages.length : cur + 1);
          };
          const goPage = (n) => {
            const box = scrollRef.current;
            const el = box && box.querySelector('[data-page="' + n + '"]');
            if (el) {
              box.scrollTo({ top: el.offsetTop - 12 });
              setPage(n);
            }
          };
          const seg = (s, i) =>
            typeof s === "string"
              ? s
              : html`<mark
                  key=${i}
                  className=${s[0] === activeEx ? "is-active" : undefined}
                  data-ex=${s[0]}
                  style=${s[0] === activeEx ? undefined : { background: "transparent", boxShadow: "none" }}
                  >${s[1]}</mark
                >`;
          if (failed)
            return html`<div className="pstep">
              <div className="nb crit" role="alert">
                ${Ico.warn(14)}
                <div>
                  <strong>The PDF couldn't be displayed.</strong>Every term and its source excerpt
                  are still available in the review panel.
                  <div className="nb-a">
                    <button type="button" className="pb pb-secondary pb-sm" onClick=${onRetry}>
                      Try again
                    </button>
                  </div>
                </div>
              </div>
            </div>`;
          return html`<div
            style=${{ display: "flex", flexDirection: "column", minHeight: 0, flex: 1 }}
          >
            <div className="vw-bar">
              ${showBack && html`<button type="button" className="pb pb-ghost pb-sm vw-back" onClick=${onBack}>${Ico.chev("l", 12)} Terms</button>`}
              <span className="vw-hl" aria-live="polite"
                >${f ? html`<span className="vw-sw" aria-hidden="true"></span><span>Showing</span><b>${f.label}</b><span className="num">p.${f.page || "—"}</span>` : html`<span>Select a term to see its source.</span>`}</span
              >
              <span className="sp"></span>
              <span className="meta num" aria-live="off">Page ${page} of ${PAGES.length}</span>
              <button
                type="button"
                className="pb pb-ghost pb-icon"
                aria-label="Previous page"
                disabled=${page <= 1}
                onClick=${() => goPage(page - 1)}
              >
                ${Ico.chev("u")}
              </button>
              <button
                type="button"
                className="pb pb-ghost pb-icon"
                aria-label="Next page"
                disabled=${page >= PAGES.length}
                onClick=${() => goPage(page + 1)}
              >
                ${Ico.chev("d")}
              </button>
              <select
                className="ctrl"
                aria-label="Zoom"
                value=${zoom}
                onChange=${(e) => setZoom(e.target.value)}
                style=${{ minHeight: 30 }}
              >
                <option value="fit">Fit width</option>
                <option value="1">100%</option>
                <option value="1.25">125%</option>
              </select>
            </div>
            ${
              f &&
              f.page &&
              !activeEx &&
              html`<div style=${{ padding: "12px 20px 0" }}>
                <div className="nb warn vw-miss">
                  ${Ico.warn(14)}
                  <div>
                    <strong>No exact location found for ${f.label}.</strong>It was read from page
                    ${f.page}; the page is shown without a highlight.
                  </div>
                </div>
              </div>`
            }
            <div
              className=${cx("vw-scroll", zoom === "fit" && "vw-fit")}
              ref=${scrollRef}
              onScroll=${onScroll}
              tabindex="0"
              role="region"
              aria-label="Contract document, 4 pages"
            >
              ${PAGES.map(
                (pg, i) =>
                  html`<article
                    key=${i}
                    className="page"
                    data-page=${i + 1}
                    aria-label=${"Page " + (i + 1)}
                    style=${zoom === "fit" ? undefined : { "--zoom": zoom }}
                  >
                    ${
                      i === 0 &&
                      html`<p className="ttl">Brightwave Analytics, Inc.</p>
                        <p className="sub">Master Subscription Agreement · Fictional sample</p>`
                    }
                    ${pg.map((b, j) =>
                      b[0] === "h"
                        ? html`<h3 key=${j}>${b[1]}</h3>`
                        : b[0] === "tbl"
                          ? html`<table key=${j} className="page-tbl">
                              <tbody>
                                ${b[1].map(
                                  (r, k) =>
                                    html`<tr key=${k}>
                                      ${
                                        r[0]
                                          ? html`<td>${r[0]}</td>
                                              <td>${r[1]}</td>`
                                          : html`<td colspan="2">${seg(r[1], k)}</td>`
                                      }
                                    </tr>`
                                )}
                              </tbody>
                            </table>`
                          : html`<p key=${j}>${b.slice(1).map(seg)}</p>`
                    )}
                    <span className="pg-n">${i + 1} / ${PAGES.length}</span>
                  </article>`
              )}
            </div>
          </div>`;
        }

        function ProcessingView({ state, canEdit, onRetry, retrying }) {
          const failed = state === "failed";
          return html`<div className="pstep">
            <ol aria-label="Processing">
              <li className="done">
                <span className="ic">${Ico.ok()}</span>
                <div>
                  <b>Uploaded</b>
                  <div className="meta">9 Oct 2026, 16:12</div>
                </div>
              </li>
              <li className="done">
                <span className="ic">${Ico.ok()}</span>
                <div>
                  <b>In queue</b>
                  <div className="meta">Started 16:12</div>
                </div>
              </li>
              <li className=${failed ? "fail" : "now"}>
                <span className="ic">${failed ? Ico.warn() : null}</span>
                <div>
                  <b>${failed ? "Extraction failed" : "Reading terms"}</b>
                  <div className="meta">
                    ${failed ? "Processing timed out before any terms were saved." : "This page updates on its own when terms are ready."}
                  </div>
                </div>
              </li>
              <li>
                <span className="ic"></span>
                <div><b>Ready for review</b></div>
              </li>
            </ol>
            ${
              failed
                ? html`<div className="nb crit" role="alert">
                    ${Ico.warn(14)}
                    <div>
                      <strong>No terms were extracted.</strong>The PDF is still stored and readable.
                      ${canEdit ? "Retrying keeps any terms you confirm later." : "Ask an owner, admin or controller to retry processing."}
                      ${canEdit && html`<div className="nb-a"><button type="button" className="pb pb-primary pb-sm" disabled=${retrying} onClick=${onRetry}>${retrying && html`<span className="spin" aria-hidden="true"></span>`}${retrying ? "Retrying…" : "Retry processing"}</button></div>`}
                    </div>
                  </div>`
                : html`<div className="skel" aria-hidden="true">
                    ${[1, 2, 3, 4, 5].map((i) => html`<i key=${i}></i>`)}
                  </div>`
            }
          </div>`;
        }

        /* ============================================================
     PAGE
     ============================================================ */
        function DocumentPage({ state, role, sc, resetKey, setState }) {
          const canEdit = role === "edit";
          const user = PEOPLE[role];
          const [fields, setFields] = useState(() => initialFields(state, sc));
          const [history, setHistory] = useState(() => initialHistory(state, sc));
          const [sel, setSel] = useState(null);
          const [filter, setFilter] = useState("attention");
          const [tab, setTab] = useState("review");
          const [mob, setMob] = useState("terms");
          const [editing, setEditing] = useState(false);
          const [keep, setKeep] = useState([]);
          const [saving, setSaving] = useState(null);
          const [saveErr, setSaveErr] = useState(null);
          const [toasts, setToasts] = useState([]);
          const [viewTick, setViewTick] = useState(0);
          const [retrying, setRetrying] = useState(false);
          const [pdfOk, setPdfOk] = useState(true);
          const failOnce = useRef(sc === "savefail");
          useEffect(() => {
            setFields(initialFields(state, sc));
            setHistory(initialHistory(state, sc));
            setSel(null);
            setEditing(false);
            setSaveErr(null);
            setFilter(state === "confirmed" ? "all" : "attention");
            setKeep([]);
            failOnce.current = sc === "savefail";
            setPdfOk(sc !== "pdffail");
            setTab("review");
          }, [resetKey]);
          const toast = useCallback((msg, err) => {
            const id = Math.random();
            setToasts((t) => [...t.slice(-2), { id, msg, err }]);
            setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 3600);
          }, []);
          const nextAttention = (after) => {
            const order = GROUPS.flatMap(([g]) => fields.filter((f) => f.group === g))
              .filter(needsAttention)
              .map((f) => f.key);
            if (!order.length) return null;
            const i = order.indexOf(after);
            return order[(i + 1) % order.length] === after
              ? null
              : order[(i + 1) % order.length] || order[0];
          };
          const focusItem = (k) =>
            setTimeout(() => {
              const el = document.getElementById("fi-" + k);
              el && el.focus({ preventScroll: false });
            }, 30);
          const onNext = () => {
            const k = nextAttention(sel) || nextAttention(null);
            if (!k) return;
            setFilter("attention");
            setTab("review");
            setMob("terms");
            setSel(k);
            setEditing(false);
            focusItem(k);
          };
          const onAct = (key, status, val) => {
            setSaving(key);
            setSaveErr(null);
            setTimeout(() => {
              setSaving(null);
              if (failOnce.current) {
                failOnce.current = false;
                setSaveErr({
                  key,
                  msg:
                    status === "corrected"
                      ? "Couldn't save this correction. Your edit is still here; try again."
                      : "Couldn't confirm this term. Nothing changed; try again.",
                });
                toast(
                  status === "verified" ? "Could not confirm field" : "Could not update field",
                  true
                );
                return;
              }
              const f = fields.find((x) => x.key === key);
              const before = fieldText(f);
              const nf = fields.map((x) =>
                x.key !== key
                  ? x
                  : status === "corrected"
                    ? {
                        ...x,
                        ...val,
                        status,
                        prev: x.prev || (x.type === "money" ? before : x.value),
                        ambiguous: false,
                        conf: x.conf,
                      }
                    : { ...x, status }
              );
              setFields(nf);
              setKeep((k) => (k.includes(key) ? k : [...k, key]));
              const after = fieldText(nf.find((x) => x.key === key));
              const stamp = "2026-10-11 " + new Date().toTimeString().slice(0, 5);
              setHistory((h) => [
                {
                  t: stamp,
                  who: user.name + " (you)",
                  kind: status === "verified" ? "ok" : status === "corrected" ? "corr" : "doc",
                  what:
                    (status === "verified"
                      ? "Confirmed "
                      : status === "corrected"
                        ? "Corrected "
                        : "Marked needs review: ") + f.label,
                  from:
                    status === "corrected"
                      ? (f.type === "date" && f.value ? fmtDate(f.value) : before) || "—"
                      : null,
                  to: status === "corrected" ? after : null,
                },
                ...h,
              ]);
              setEditing(false);
              toast(
                status === "verified"
                  ? f.label + " confirmed."
                  : status === "corrected"
                    ? f.label + " corrected."
                    : f.label + " marked needs review."
              );
              if (status !== "suggested") {
                const order = GROUPS.flatMap(([g]) => nf.filter((x) => x.group === g))
                  .filter(needsAttention)
                  .map((x) => x.key);
                const k = order.find((x) => x !== key);
                if (k) {
                  setSel(k);
                  focusItem(k);
                } else {
                  setSel(key);
                  toast("All terms confirmed. Renewal timing now uses confirmed values.");
                }
              }
            }, 600);
          };
          const onView = (k) => {
            setSel(k);
            setMob("doc");
            setViewTick((t) => t + 1);
          };
          const titleText =
            fieldText(fields.find((f) => f.key === "vendor_name")) || "brightwave-msa-2025.pdf";
          const attention = fields.filter(needsAttention).length;
          const docTitle =
            state === "processing" || state === "failed"
              ? "brightwave-msa-2025.pdf"
              : "Brightwave Analytics";

          if (state === "unavailable") {
            return html`<${ApplicationShell} toast=${toast} user=${user}
              ><${TopBar} toast=${toast} title="Contract" />
              <main id="main-content">
                <div className="empty" role="alert">
                  <span className="ic">${Ico.warn(18)}</span>
                  <h1 style=${{ fontSize: 20 }}>This contract couldn't be loaded.</h1>
                  <p>
                    It may have been removed from this workspace, or you may not have access to it.
                    Nothing about it has changed.
                  </p>
                  <div className="fa" style=${{ justifyContent: "center" }}>
                    <button
                      type="button"
                      className="pb pb-primary"
                      onClick=${() => toast("Retries the request (existing Retry).")}
                    >
                      Try again</button
                    ><button
                      type="button"
                      className="pb pb-secondary"
                      onClick=${() => toast("Back to Contracts.")}
                    >
                      Back to Contracts
                    </button>
                  </div>
                </div>
              </main>
              <${BottomNav} toast=${toast} />${Toasts(toasts)}<//
            >`;
          }
          const processingLike = state === "processing" || state === "failed";
          const termsVisible = mob !== "doc";
          const mobTab = mob === "doc" ? "doc" : tab;
          return html`<${ApplicationShell} toast=${toast} user=${user}>
            <${TopBar} toast=${toast} title=${docTitle} />
            <main
              id="main-content"
              aria-labelledby="doc-h"
              style=${{ display: "flex", flexDirection: "column", minHeight: 0, flex: 1 }}
            >
              <${DocumentHeader}
                state=${state}
                canEdit=${canEdit}
                attention=${attention}
                onNext=${onNext}
                toast=${toast}
                title=${processingLike ? "brightwave-msa-2025.pdf" : titleText}
              />
              ${!processingLike && html`<${Overview} fields=${fields} sc=${sc} />`}
              <div className="ws-tabs" role="tablist" aria-label="Workspace">
                ${[
                  ["review", "Terms"],
                  ["doc", "Document"],
                  ["details", "Details"],
                  ["history", "History"],
                ].map(
                  ([k, l]) =>
                    html`<button
                      key=${k}
                      type="button"
                      role="tab"
                      aria-selected=${mobTab === k}
                      onClick=${() => {
                        if (k === "doc") setMob("doc");
                        else {
                          setMob("terms");
                          setTab(k);
                        }
                      }}
                    >
                      ${l}
                    </button>`
                )}
              </div>
              <div className="ws ws-h">
                <section
                  className="pane pane-terms"
                  data-hidden=${!termsVisible}
                  aria-label="Terms and review"
                >
                  <div className="ptabs is-desk" role="tablist" aria-label="Review panel">
                    ${[
                      ["review", "Review", processingLike ? null : attention],
                      ["details", "Details"],
                      ["history", "History", history.length],
                    ].map(
                      ([k, l, n]) =>
                        html`<button
                          key=${k}
                          type="button"
                          role="tab"
                          aria-selected=${tab === k}
                          onClick=${() => setTab(k)}
                        >
                          ${l}${n != null && html`<span className="ct">${n}</span>`}
                        </button>`
                    )}
                  </div>
                  <div className="pscroll">
                    ${
                      tab === "review"
                        ? processingLike
                          ? html`<${ProcessingView}
                              state=${state}
                              canEdit=${canEdit}
                              retrying=${retrying}
                              onRetry=${() => {
                                setRetrying(true);
                                setTimeout(() => {
                                  setRetrying(false);
                                  setState("processing");
                                }, 900);
                              }}
                            />`
                          : html`<${FieldReviewList}
                              fields=${fields}
                              sel=${sel}
                              setSel=${setSel}
                              canEdit=${canEdit}
                              onAct=${onAct}
                              saving=${saving}
                              saveErr=${saveErr}
                              onView=${onView}
                              filter=${filter}
                              setFilter=${(x) => {
                                setKeep([]);
                                setFilter(x);
                              }}
                              editing=${editing}
                              setEditing=${setEditing}
                              user=${user}
                              keep=${keep}
                            />`
                        : tab === "details"
                          ? html`<${DetailsPanel} fields=${fields} state=${state} />`
                          : html`<${ReviewHistory} items=${history} />`
                    }
                  </div>
                </section>
                <section
                  className="pane pane-doc"
                  data-hidden=${mob !== "doc"}
                  aria-label="Document"
                >
                  <${DocumentViewer}
                    sel=${sel}
                    fields=${fields}
                    failed=${!pdfOk}
                    onRetry=${() => {
                      toast("Prototype: the viewer reloads.");
                      setPdfOk(true);
                    }}
                    onBack=${() => {
                      setMob("terms");
                      setTab("review");
                      sel && focusItem(sel);
                    }}
                    viewRef=${viewTick}
                    showBack=${true}
                  />
                </section>
              </div>
            </main>
            <${BottomNav} toast=${toast} />
            ${Toasts(toasts)}
          <//>`;
        }
        const Toasts = (toasts) =>
          html`<div className="ptoast" role="status" aria-live="polite">
            ${toasts.map((t) => html`<div key=${t.id} className=${t.err ? "err" : ""}>${t.err ? Ico.warn() : Ico.ok()}<span>${t.msg}</span></div>`)}
          </div>`;

        /* ============================================================
     REVIEW SHELL (outside the proposed UI)
     ============================================================ */
        const NOTES = html`<p style=${{ marginTop: 8 }}>
            Page design v1.0.1 · For review · Product UI Design System v0.1 (proposed). All contract
            content is fictional; nothing connects to LedgerGuard.
          </p>
          <h3>Design-system rules</h3>
          <ul>
            <li>
              <b>Breadcrumb (standard):</b> one breadcrumb on every detail page, in the style this
              page uses: muted parent link with no underline, chevron separator, current page in
              bold with an ellipsis. List context goes in the link's tooltip and accessible name,
              not as visible text.
            </li>
            <li>
              <b>Implementation follows this design 100%.</b> Build exactly what's designed, and in
              the same change remove what isn't: extra sections, components, features, old code
              paths and dead code. Missing API capabilities are recorded as gaps, not replaced with
              different UI.
            </li>
          </ul>
          <h3>v1.0.1: colours and navigation</h3>
          <p>
            The sidebar follows navigation v0.3, like every other product page: Dashboard,
            Contracts, Renewals and Vendors, then Settings, Help and Account. Reports and Audit log
            are no longer in the sidebar; they are reached from Settings, contextual links and
            search. The phone bar reads Home, Contracts, Renewals, Review, Search.
          </p>
          <p>
            The dark theme now uses the Product UI v0.3 neutral charcoal and surface roles, the same
            as Dashboard, Contracts, Renewals, Vendors, Settings and Vendor detail: canvas, panes,
            inputs, menus and the selected term row. The PDF page keeps its paper colour, framed by
            a stronger line on the dark canvas. Light colours, page layout, behaviour and typefaces
            are unchanged.
          </p>
          <h3>The idea</h3>
          <p>
            One workspace, two panes. Terms on the left, the contract on the right, kept in sync:
            select a term and its clause is highlighted on its page. Confirm or correct without
            leaving the page; the next term to review opens automatically.
          </p>
          <h3>Try this</h3>
          <ol>
            <li>
              Press Review next term, then Confirm a few terms and watch progress, the timeline and
              history update.
            </li>
            <li>
              Set Scenario to Ambiguous term, open Term end date, and use Edit value to save 31 Mar
              2027.
            </li>
            <li>Set Role to Viewer: no review controls, one explanation.</li>
            <li>Try Save failure, Missing source, Different currency and PDF can't display.</li>
            <li>In the term list, ↑ ↓ Home End move between terms.</li>
          </ol>
          <h3>Verified product behavior used here</h3>
          <ul>
            <li>
              Statuses suggested / verified / corrected; confirm, edit (corrected) and mark needs
              review (back to suggested) are the existing PATCH actions.
            </li>
            <li>
              Notice deadline = term end − notice days; timing is verified only when both are
              confirmed or corrected.
            </li>
            <li>
              Processing states queued, processing, needs_review, processed and failed; retry exists
              for failed documents and keeps confirmed values.
            </li>
            <li>EDIT_DOCUMENT: Owner, Admin, Controller. Viewer is read-only.</li>
            <li>
              Reviewer names come from the document events endpoint, which the page doesn't show
              today.
            </li>
          </ul>
          <h3>Proposed (needs build or approval)</h3>
          <ul>
            <li>
              A separate Corrected chip (the app shows both "Confirmed" and "Manual entry" today).
            </li>
            <li>Review history and details as panel tabs.</li>
            <li>Zoom and page controls in the viewer.</li>
            <li>
              Auto-advance after confirming; "Reviewed" document label; Export CSV in the menu.
            </li>
          </ul>`;
        function Notes({ onClose }) {
          const ref = useRef(null);
          useEffect(() => {
            ref.current && ref.current.focus();
            const k = (e) => {
              if (e.key === "Escape") onClose();
            };
            window.addEventListener("keydown", k);
            return () => window.removeEventListener("keydown", k);
          }, []);
          return html`<div className="scrim" onClick=${onClose}></div>
            <aside className="notes" role="dialog" aria-modal="true" aria-labelledby="notes-h">
              <div className="notes-h">
                <h2 id="notes-h">Design notes</h2>
                <button
                  ref=${ref}
                  type="button"
                  className="pb pb-secondary pb-sm"
                  onClick=${onClose}
                >
                  Close
                </button>
              </div>
              ${NOTES}
            </aside>`;
        }
        const viewerTheme = () => {
          try {
            return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          } catch (e) {
            return "light";
          }
        };
        function App() {
          const [state, setState] = useState("ready");
          const [role, setRole] = useState("edit");
          const [sc, setSc] = useState("ambiguous");
          const [theme, setTheme] = useState("auto");
          const [vp, setVp] = useState("desktop");
          const [notes, setNotes] = useState(false);
          const [k, setK] = useState(0);
          const bump = () => setK((x) => x + 1);
          const th = theme === "auto" ? viewerTheme() : theme;
          const sel = (label, val, set, opts) =>
            html`<label
              >${label}
              <select
                value=${val}
                onChange=${(e) => {
                  set(e.target.value);
                  bump();
                }}
              >
                ${opts.map(([v, l]) => html`<option key=${v} value=${v}>${l}</option>`)}
              </select></label
            >`;
          return html`<div className=${"s-" + th} style=${{ minHeight: "100vh" }}>
            <div className="rb" role="region" aria-label="Prototype controls">
              <span><strong>LedgerGuard</strong> · /documents/[id]</span
              ><span className="rb-tag">v1.0.1 · For review · Prototype, fictional data</span>
              ${sel("State", state, setState, [
                ["processing", "Processing"],
                ["ready", "Ready for review"],
                ["partial", "Partially reviewed"],
                ["confirmed", "Confirmed"],
                ["failed", "Processing failed"],
                ["unavailable", "Unavailable"],
              ])}
              ${sel("Role", role, setRole, [
                ["edit", "Controller (can edit)"],
                ["view", "Viewer (read-only)"],
              ])}
              ${sel("Scenario", sc, setSc, [
                ["normal", "Normal contract"],
                ["ambiguous", "Ambiguous term"],
                ["nosource", "Missing source"],
                ["savefail", "Save failure"],
                ["currency", "Different currency"],
                ["pdffail", "PDF can't display"],
              ])}
              ${sel("Theme", theme, setTheme, [
                ["auto", "Viewer setting"],
                ["light", "Light"],
                ["dark", "Dark"],
              ])}
              ${sel("Width", vp, setVp, [
                ["desktop", "Full"],
                ["tablet", "Tablet 820"],
                ["mobile", "Phone 390"],
              ])}
              <span className="sp"></span
              ><button type="button" onClick=${() => setNotes(true)}>Design notes</button>
            </div>
            <div className=${"stage" + (vp !== "desktop" ? " is-framed is-" + vp : "")}>
              <div className="app">
                <${DocumentPage}
                  key=${role + sc}
                  state=${state}
                  role=${role}
                  sc=${sc}
                  resetKey=${k}
                  setState=${(s) => {
                    setState(s);
                    bump();
                  }}
                />
              </div>
            </div>
            ${notes && html`<${Notes} onClose=${() => setNotes(false)} />`}
          </div>`;
        }
        ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
      })();
    </script>
  </body>
</html>
