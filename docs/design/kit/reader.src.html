<title>Writing Reader</title>
@@HEAD@@
<style>
@@BASE_CSS@@
  /* Layout: one article at a time, picked by the slug in the link's hash. Header sets the title in wide
     display type beside the date and tags; a sticky contents column tracks the H2s; the article column
     holds prose, code and the same diagram blocks the case studies use. */
  .crumbs { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 24px; border-bottom: 1px solid var(--rule); color: var(--mute); }
  .crumbs a { text-decoration: none; }
  .crumbs a:hover { color: var(--line); text-decoration: underline; text-underline-offset: 4px; }
  .crumbs [aria-current] { color: var(--line); max-width: 46ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .ahead { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 8fr); border-bottom: 1px solid var(--rule); }
  .ahead__meta { padding: 26px 24px; border-right: 1px solid var(--rule); display: grid; gap: 14px; align-content: start; }
  .ahead__meta dl { margin: 0; display: grid; border: 1px solid var(--rule); }
  .ahead__meta dl > div { display: grid; gap: 4px; padding: 10px 12px; border-bottom: 1px solid var(--rule); }
  .ahead__meta dl > div:last-child { border-bottom: 0; }
  .ahead__meta dt { color: var(--mute); }
  .ahead__meta dd { margin: 0; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tags span { font-family: var(--mono); font-size: 12px; letter-spacing: .04em; border: 1px solid var(--rule); padding: 2px 8px; border-radius: 99px; }
  .tags .sched { background: var(--line); color: var(--ink); border-color: var(--line); }
  .ahead__title { padding: 26px 24px 30px; display: grid; gap: 18px; align-content: start; }
  .ahead h1 { margin: 0; font-family: var(--display); font-weight: 800; font-stretch: 112%; text-transform: uppercase; font-size: clamp(32px, 5.2cqi, 76px); line-height: .92; text-wrap: balance; }
  .ahead__lede { margin: 0; font-size: clamp(18px, 1.5vw, 22px); line-height: 1.5; color: var(--mute); max-width: 60ch; }

  .body { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 8fr); border-bottom: 1px solid var(--rule); }
  .toc { border-right: 1px solid var(--rule); }
  .toc__stick { position: sticky; top: 0; padding: 22px 24px; display: grid; gap: 12px; max-height: 100vh; overflow: auto; }
  .toc__stick > .mono { color: var(--mute); }
  .toc ol { list-style: none; margin: 0; padding: 0; display: grid; border: 1px solid var(--rule); }
  .toc a { position: relative; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--rule); text-decoration: none; font-size: 14px; line-height: 1.4; color: var(--mute); transition: background .25s, color .25s; }
  .toc li:last-child a { border-bottom: 0; }
  .toc a .mono { font-size: 11px; padding-top: 2px; }
  .toc a:hover { color: var(--line); }
  .toc a.on { background: var(--line); color: var(--ink); }
  .toc a::after { content: ""; position: absolute; left: 0; bottom: -1px; height: 2px; width: 100%; background: var(--line); transform-origin: left; transform: scaleX(var(--p, 0)); }
  .toc a.on::after { background: var(--ink); }

  /* ── Prose ── */
  .prose { padding: 30px 24px 40px; min-width: 0; display: grid; gap: 22px; align-content: start; font-size: 18px; line-height: 1.7; }
  .prose > * { margin: 0; max-width: 68ch; min-width: 0; }
  .prose > .dg, .prose > .tbl, .prose > pre, .prose > figure { max-width: none; }
  .prose h2 { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--rule); font-family: var(--display); font-weight: 800; font-stretch: 118%; text-transform: uppercase; font-size: clamp(24px, 2.6vw, 38px); line-height: .98; text-wrap: balance; scroll-margin-top: 20px; display: grid; gap: 10px; }
  .prose h2::before { content: attr(data-n); font-family: var(--mono); font-weight: 400; font-stretch: 100%; font-size: 12px; letter-spacing: .08em; color: var(--mute); }
  .prose h3 { font-size: 20px; line-height: 1.3; font-weight: 600; margin-top: 8px; }
  .prose a { text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 4px; transition: text-decoration-color .2s; }
  .prose a:hover { text-decoration-color: var(--line); }
  .prose strong { font-weight: 600; }
  .prose ul, .prose ol { padding: 0; list-style: none; display: grid; gap: 8px; }
  .prose li { position: relative; padding-left: 28px; }
  .prose ul > li::before { content: ""; position: absolute; left: 4px; top: .72em; width: 10px; height: 1px; background: var(--line); }
  .prose ol { counter-reset: n; }
  .prose ol > li { counter-increment: n; }
  .prose ol > li::before { content: counter(n, decimal-leading-zero); position: absolute; left: 0; top: .3em; font-family: var(--mono); font-size: 12px; color: var(--mute); }
  .prose blockquote { border-left: 2px solid var(--line); padding: 4px 0 4px 18px; color: var(--mute); }
  .prose blockquote p { margin: 0; }
  .prose :not(pre) > code { font-family: var(--mono); font-size: .86em; background: var(--ink-2); border: 1px solid var(--rule); padding: 1px 5px; }
  .prose pre { background: var(--ink-2); border: 1px solid var(--rule); padding: 16px 18px; overflow-x: auto; font-size: 14px; line-height: 1.6; }
  .prose pre code { font-family: var(--mono); color: #cfcfc8; }
  .hljs-keyword, .hljs-built_in, .hljs-title, .hljs-section, .hljs-name, .hljs-selector-tag { color: var(--line); font-weight: 500; }
  .hljs-string, .hljs-attr, .hljs-attribute, .hljs-symbol { color: var(--bone-2); }
  .hljs-number, .hljs-literal, .hljs-type, .hljs-variable { color: var(--bone); }
  .hljs-comment, .hljs-meta, .hljs-quote { color: var(--mute); font-style: italic; }
  .tbl { overflow-x: auto; border: 1px solid var(--rule); }
  .tbl table { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 15px; line-height: 1.5; }
  .tbl th { text-align: left; font-family: var(--mono); font-weight: 500; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; background: var(--line); color: var(--ink); }
  .tbl th, .tbl td { padding: 10px 14px; border-bottom: 1px solid var(--rule); vertical-align: top; }
  .tbl tr:last-child td { border-bottom: 0; }
  .prose figure:not(.dg) { display: grid; gap: 10px; }
  .prose figure:not(.dg) img { display: block; width: 100%; height: auto; border: 1px solid var(--rule); background: var(--line); }
  .prose figcaption:not(.dg__head):not(.dg__band-head) { color: var(--mute); font-size: 15px; line-height: 1.5; }
  .prose hr { border: 0; border-top: 1px solid var(--rule); }

  .more__head { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; padding: 30px 24px 16px; border-bottom: 1px solid var(--rule); }
  .more__head h2 { margin: 0; font-family: var(--display); font-weight: 800; font-stretch: 125%; text-transform: uppercase; font-size: clamp(30px, 4.6vw, 72px); line-height: .9; }
  .more__head a { text-decoration: none; display: inline-flex; gap: 10px; align-items: center; }
  .more ol { list-style: none; margin: 0; padding: 0; }
  .more a.row { display: grid; grid-template-columns: 130px minmax(0, 1fr) auto; gap: 16px; align-items: baseline; padding: 14px 24px; border-bottom: 1px solid var(--rule); text-decoration: none; transition: background .25s, color .25s; }
  .more a.row .mono { color: var(--mute); }
  .more a.row strong { font-weight: 500; font-size: 17px; line-height: 1.35; }
  .more a.row:hover, .more a.row:focus-visible { background: var(--line); color: var(--ink); }
  .more a.row:hover .mono, .more a.row:focus-visible .mono { color: var(--mute-ink); }
  .more a.row[aria-current] { color: var(--mute); }

  @media (max-width: 960px) {
    .body { grid-template-columns: minmax(0, 1fr); }
    .toc { border-right: 0; border-bottom: 1px solid var(--rule); }
    .toc__stick { position: static; max-height: none; }
  }
  @media (max-width: 760px) {
    .crumbs { padding-inline: 16px; }
    .crumbs [aria-current] { max-width: 22ch; }
    .ahead { grid-template-columns: minmax(0, 1fr); }
    .ahead__meta { border-right: 0; border-bottom: 1px solid var(--rule); padding: 20px 16px; order: 2; }
    .ahead__title { padding: 22px 16px 24px; }
    .ahead h1 { font-size: 8.4cqi; }
    .toc__stick { padding: 18px 16px; }
    .prose { padding: 22px 16px 30px; font-size: 17px; }
    .more__head { padding: 24px 16px 14px; }
    .more a.row { grid-template-columns: minmax(0, 1fr) auto; padding: 14px 16px; row-gap: 4px; }
    .more a.row .mono { grid-column: 1 / -1; }
  }
</style>
@@CHROME@@
<div class="frame">
  <div class="shell">
    @@NAV:writing@@
    <nav class="crumbs mono" aria-label="Breadcrumb">
      <a href="@@L:/@@">Home</a><span aria-hidden="true">/</span>
      <a href="@@L:/writing@@">Writing</a><span aria-hidden="true">/</span>
      <span aria-current="page" id="crumb"></span>
    </nav>
    <div class="ticker" aria-hidden="true"><div class="ticker__track" data-dir="1" id="ticker"></div></div>

    <article id="article" aria-labelledby="a-title">
      <header class="ahead">
        <div class="ahead__meta">
          <dl>
            <div><dt class="mono">Published</dt><dd id="a-date"></dd></div>
            <div><dt class="mono">Topics</dt><dd class="tags" id="a-tags"></dd></div>
          </dl>
        </div>
        <div class="ahead__title">
          <h1 id="a-title"></h1>
          <p class="ahead__lede" id="a-lede"></p>
        </div>
      </header>
      <div class="body">
        <aside class="toc" aria-label="On this page"><div class="toc__stick"><span class="mono">[ On this page ]</span><ol id="toc"></ol></div></aside>
        <div class="prose" id="prose"></div>
      </div>
    </article>

    <section class="more" aria-labelledby="more-t">
      <div class="more__head"><h2 id="more-t">More writing</h2><a class="mono" href="@@L:/writing@@">All writing <span class="chev" aria-hidden="true"><svg><use href="#chev"/></svg></span></a></div>
      <ol id="more"></ol>
    </section>
    <nav class="next" aria-label="More from the site">
      <a href="@@L:/portfolio@@"><span class="mono">[ Case studies ]</span><strong>Portfolio <span class="chev" aria-hidden="true"><svg><use href="#chev"/></svg></span></strong></a>
      <a href="@@L:/engineering-principles@@"><span class="mono">[ Operating model ]</span><strong>Principles <span class="chev" aria-hidden="true"><svg><use href="#chev"/></svg></span></strong></a>
      <a href="@@L:/@@#contact"><span class="mono">[ Contact ]</span><strong>Get in touch <span class="chev" aria-hidden="true"><svg><use href="#chev"/></svg></span></strong></a>
    </nav>
    @@FOOT@@
  </div>
</div>

<script>
(() => {
@@BASE_JS@@
  // Posts come from content/posts, rendered with the site's own Markdown and diagram pipeline.
  const POSTS = @@READER_JSON@@;
  const $ = (id) => document.getElementById(id);
  const today = new Intl.DateTimeFormat("en-CA", { timeZone: "America/Toronto" }).format(new Date());
  const fmt = (d) => new Date(`${d}T12:00:00`).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
  const latest = POSTS.find((p) => p.date <= today) ?? POSTS[0];
  const SELF = link("/writing/x").replace(/#x$/, "#");
  let tocLinks = [], heads = [];

  const show = (slug, { scroll = true } = {}) => {
    const post = POSTS.find((p) => p.slug === slug) ?? latest;
    document.title = `${post.title} · Writing`;
    $("crumb").textContent = post.title;
    $("a-title").textContent = post.title;
    $("a-lede").textContent = post.excerpt;
    $("a-date").textContent = fmt(post.date);
    $("a-tags").innerHTML = (post.date > today ? [`<span class="sched">Scheduled</span>`] : []).concat(post.tags.map((t) => `<span>${esc(t)}</span>`)).join("");
    const words = [post.title, ...post.headings.map((h) => h.text)];
    const run = `<div class="ticker__run">${words.map((w) => `<span>${esc(w)}</span><svg aria-hidden="true"><use href="#spark"/></svg>`).join("")}</div>`;
    $("ticker").innerHTML = run + run.replace("ticker__run", 'ticker__run" aria-hidden="true');

    const prose = $("prose");
    prose.innerHTML = post.html.replace(/<div data-diagram-slot="(\d+)"><\/div>/g, (_, i) => renderDiagram(post.diagrams[+i]));
    prose.querySelectorAll("table").forEach((t) => { const w = document.createElement("div"); w.className = "tbl"; t.replaceWith(w); w.append(t); });
    heads = [...prose.querySelectorAll("h2[id]")];
    heads.forEach((h, i) => h.dataset.n = `[ ${pad(i)} ]`);
    $("toc").innerHTML = heads.map((h, i) => `<li><a href="#${post.slug}" data-to="${h.id}"><span class="mono">${pad(i)}</span><span>${esc(h.textContent)}</span></a></li>`).join("");
    tocLinks = [...$("toc").querySelectorAll("a")];
    $("toc").closest(".toc").hidden = !heads.length;

    $("more").innerHTML = POSTS.map((p) => `<li><a class="row" href="#${p.slug}"${p.slug === post.slug ? ' aria-current="page"' : ""}><span class="mono">${fmt(p.date)}</span><strong>${esc(p.title)}</strong><span class="chev" aria-hidden="true"><svg><use href="#chev"/></svg></span></a></li>`).join("")
      + `<li><a class="row" href="@@L:/writing/agent-readiness-doctor@@"><span class="mono">Agent Readiness Doctor</span><strong>Read the launch article</strong><span class="chev" aria-hidden="true"><svg><use href="#chev"/></svg></span></a></li>`;
    if (scroll) scrollTo({ top: 0, behavior: "instant" });
  };

  // Contents links scroll within the post; links to other posts in this reader switch in place.
  document.addEventListener("click", (e) => {
    const a = e.target.closest("a");
    if (!a) return;
    if (a.dataset.to) { e.preventDefault(); $(a.dataset.to).scrollIntoView({ behavior: reduce ? "instant" : "smooth" }); return; }
    const href = a.getAttribute("href");
    const slug = href.startsWith(SELF) ? href.slice(SELF.length) : href.startsWith("#") ? href.slice(1) : null;
    if (slug && POSTS.some((p) => p.slug === slug)) { e.preventDefault(); history.replaceState(null, "", `#${slug}`); show(slug); }
  });
  addEventListener("hashchange", () => show(location.hash.slice(1)));
  show(location.hash.slice(1), { scroll: false });

  if (reduce) return;
  runPortal((time, { vh }) => {
    let cur = -1;
    heads.forEach((h, i) => { if (h.getBoundingClientRect().top < vh * .35) cur = i; });
    tocLinks.forEach((a, i) => {
      a.classList.toggle("on", i === cur);
      const top = heads[i].getBoundingClientRect().top, end = heads[i + 1] ? heads[i + 1].getBoundingClientRect().top : $("prose").getBoundingClientRect().bottom;
      a.style.setProperty("--p", clamp((vh * .35 - top) / Math.max(1, end - top), 0, 1).toFixed(3));
    });
    lightDiagrams(vh);
  });
})();
</script>
