<title>Now</title>
@@HEAD@@
<style>
@@BASE_CSS@@
  /* Layout: display word over a week ruler for the year with a cursor on this week, then the snapshot
     sections as numbered hairline cells. The stack runs as a ticker on the light band and stays listed below it. */
  .crumbs { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 24px; border-bottom: 1px solid var(--rule); color: var(--mute); }
  .crumbs a { text-decoration: none; }
  .crumbs a:hover { color: var(--line); text-decoration: underline; text-underline-offset: 4px; }
  .crumbs [aria-current] { color: var(--line); }
  .name { font-size: 12.6cqi; }

  .intro { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 8fr); border-bottom: 1px solid var(--rule); }
  .intro__over { padding: 22px 24px; border-right: 1px solid var(--rule); display: grid; gap: 10px; align-content: start; }
  .intro__over .mono { color: var(--mute); }
  .intro__over strong { font-family: var(--display); font-weight: 800; font-stretch: 125%; text-transform: uppercase; font-size: clamp(22px, 2.4vw, 34px); line-height: 1; }
  .intro p { margin: 0; padding: 22px 24px; font-size: clamp(20px, 2vw, 30px); line-height: 1.35; max-width: 36ch; text-wrap: balance; }

  .ruler { position: relative; border-bottom: 1px solid var(--rule); }
  .ruler canvas { width: 100%; height: 132px; }
  .ruler__label { position: absolute; top: 14px; left: 0; padding: 4px 8px; background: var(--line); color: var(--ink); white-space: nowrap; transform: translateX(-50%); pointer-events: none; }

  .cells { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-bottom: 1px solid var(--rule); }
  .cell { display: grid; grid-template-rows: auto auto 1fr auto; gap: 16px; padding: 24px; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); min-width: 0; transition: background .35s; }
  .cell:nth-child(2n) { border-right: 0; }
  .cell:nth-last-child(-n+2):nth-child(odd), .cell:last-child { border-bottom: 0; }
  .cell__n { color: var(--mute); }
  .cell h2 { margin: 0; font-family: var(--display); font-weight: 800; font-stretch: 125%; text-transform: uppercase; font-size: clamp(30px, 4cqi, 60px); line-height: .9; }
  .cell ul { list-style: none; margin: 0; padding: 0; display: grid; border-top: 1px solid var(--rule); }
  .cell li { padding: 12px 0; border-bottom: 1px solid var(--rule); font-size: 17px; line-height: 1.55; display: grid; grid-template-columns: 28px minmax(0, 1fr); }
  .cell li::before { content: "—"; color: var(--mute); }
  .cell a { justify-self: start; display: inline-flex; gap: 10px; align-items: center; text-decoration: none; }
  .cell a:hover { text-decoration: underline; text-underline-offset: 5px; }
  .cell.on { background: var(--ink-2); }

  .band__in { border-left: 1px solid var(--bone-2); border-right: 1px solid var(--bone-2); }
  .shell > .band { margin-left: calc(-1 * var(--gutter-l) - 1px); margin-right: calc(-1 * var(--gutter-r) - 1px); padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
  .stack__head { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; padding: 26px 24px 16px; border-bottom: 1px solid var(--ink); }
  .stack__head h2 { margin: 0; font-family: var(--display); font-weight: 800; font-stretch: 125%; text-transform: uppercase; font-size: clamp(30px, 5.6cqi, 88px); line-height: .9; }
  .band .ticker { border-color: var(--ink); }
  .band .ticker__run { font-family: var(--display); font-style: normal; font-weight: 800; font-stretch: 118%; text-transform: uppercase; font-size: clamp(28px, 4.4cqi, 64px); gap: 26px; padding-right: 26px; }
  .band .ticker__run svg { width: .4em; height: .4em; }
  .stack__list { list-style: none; margin: 0; padding: 16px 24px 20px; display: flex; flex-wrap: wrap; gap: 6px; border-top: 1px solid var(--ink); }
  .stack__list li { font-family: var(--mono); font-size: 12px; letter-spacing: .04em; border: 1px solid var(--ink); padding: 3px 9px; border-radius: 99px; }

  @media (max-width: 760px) {
    .crumbs { padding-inline: 16px; }
    .intro, .cells { grid-template-columns: minmax(0, 1fr); }
    .intro__over { border-right: 0; border-bottom: 1px solid var(--rule); padding: 18px 16px; }
    .intro p { padding: 18px 16px; }
    .cell { border-right: 0; padding: 20px 16px; }
    .cell:nth-last-child(-n+2):nth-child(odd) { border-bottom: 1px solid var(--rule); }
    .cell h2 { font-size: 10cqi; }
    .ruler canvas { height: 110px; }
    .stack__head { padding: 22px 16px 14px; }
    .stack__list { padding: 14px 16px 18px; }
  }
</style>
@@CHROME@@
<div class="frame">
  <div class="shell">
    @@NAV:none@@
    <nav class="crumbs mono" aria-label="Breadcrumb">
      <a href="@@L:/@@">Home</a><span aria-hidden="true">/</span>
      <span aria-current="page" id="crumb"></span>
    </nav>
    <h1 class="name" data-part id="display">
      <span id="display-a"></span>
      <svg class="star" viewBox="0 0 20 20" aria-hidden="true"><use href="#spark"/></svg>
      <span id="display-b"></span>
    </h1>
    <section class="intro" aria-label="About this page">
      <div class="intro__over"><span class="mono">[ alipajand.com/now ]</span><strong id="overline"></strong></div>
      <p id="lede"></p>
    </section>
    <div class="ruler" aria-hidden="true"><canvas id="ruler"></canvas><span class="ruler__label mono" id="ruler-label"></span></div>

    <ol class="cells" id="cells"></ol>

    <section class="band" id="stack" aria-labelledby="stack-t">
      <div class="band__in">
        <div class="stack__head"><h2 id="stack-t"></h2><span class="mono" id="stack-n"></span></div>
        <div class="ticker" aria-hidden="true"><div class="ticker__track" data-dir="1" id="stack-ticker"></div></div>
        <ul class="stack__list" id="stack-list"></ul>
      </div>
    </section>

    <nav class="next" aria-label="More from the site">
      <a href="@@L:/portfolio@@"><span class="mono">[ Case studies ]</span><strong>Portfolio <span class="chev" aria-hidden="true"><svg><use href="#chev"/></svg></span></strong></a>
      <a href="@@L:/writing@@"><span class="mono">[ Notes ]</span><strong>Writing <span class="chev" aria-hidden="true"><svg><use href="#chev"/></svg></span></strong></a>
      <a href="@@L:/@@#contact"><span class="mono">[ Contact ]</span><strong>Get in touch <span class="chev" aria-hidden="true"><svg><use href="#chev"/></svg></span></strong></a>
    </nav>
    @@FOOT@@
  </div>
</div>

<script>
(() => {
@@BASE_JS@@
  // Content is data/now.ts. The stack section splits on " · " into the ticker and the list.
  const NOW = @@NOW_JSON@@;
  const $ = (id) => document.getElementById(id);
  const chev = `<span class="chev" aria-hidden="true"><svg><use href="#chev"/></svg></span>`;
  const year = new Intl.DateTimeFormat("en-CA", { timeZone: "America/Toronto", year: "numeric" }).format(new Date());

  $("crumb").textContent = NOW.title;
  $("display").setAttribute("aria-label", NOW.title);
  $("display-a").textContent = NOW.title;
  $("display-b").textContent = year;
  $("overline").textContent = NOW.overline;
  $("lede").textContent = NOW.lede;

  const stack = NOW.sections.find((s) => s.id === "current-stack");
  const rest = NOW.sections.filter((s) => s !== stack);
  $("cells").innerHTML = rest.map((s, i) => `
    <li class="cell" id="${s.id}">
      <span class="cell__n mono">[ ${pad(i)} ]</span>
      <h2>${esc(s.title)}</h2>
      <ul>${s.items.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
      ${s.footer ? `<a class="mono" href="${link(s.footer.href)}">${esc(s.footer.label)} ${chev}</a>` : "<span></span>"}
    </li>`).join("");
  const tools = stack.items.join(" · ").split(" · ");
  $("stack-t").textContent = stack.title;
  $("stack-n").textContent = `[ ${pad(rest.length)} ] · ${tools.length} tools`;
  const run = `<div class="ticker__run">${tools.map((t) => `<span>${esc(t)}</span><svg aria-hidden="true"><use href="#spark"/></svg>`).join("")}</div>`;
  $("stack-ticker").innerHTML = run + run.replace("ticker__run", 'ticker__run" aria-hidden="true');
  $("stack-list").innerHTML = tools.map((t) => `<li>${esc(t)}</li>`).join("");

  // Week ruler: 52 ticks for the year, the cursor sits on this week and the ruler drifts with scroll.
  const start = new Date(`${year}-01-01T00:00:00`);
  const week = Math.min(52, Math.floor((Date.now() - start) / (7 * 864e5)) + 1);
  const canvas = $("ruler"), label = $("ruler-label");
  label.textContent = `Now · wk ${String(week).padStart(2, "0")} / 52`;
  const drawRuler = (shift) => {
    const { ctx, w, h } = fitCanvas(canvas);
    ctx.clearRect(0, 0, w, h);
    const left = 24, right = w - 24, step = (right - left) / 52, base = h - 26;
    ctx.font = "11px 'Geist Mono', monospace"; ctx.textAlign = "center";
    for (let i = 0; i <= 52; i++) {
      const x = left + i * step + shift * step;
      const month = i % 4.33 < 1;
      ctx.strokeStyle = `rgba(${LINE},${i < week ? .9 : .32})`;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, base); ctx.lineTo(x, base - (i % 13 === 0 ? 46 : month ? 26 : 14)); ctx.stroke();
      if (i % 13 === 0 && i < 52) { ctx.fillStyle = `rgba(${LINE},.6)`; ctx.fillText(`Q${i / 13 + 1}`, x + step * 6.5, base + 18); }
    }
    ctx.strokeStyle = `rgba(${LINE},.5)`; ctx.beginPath(); ctx.moveTo(left, base + .5); ctx.lineTo(right, base + .5); ctx.stroke();
    const cx = left + (week - .5) * step + shift * step;
    ctx.strokeStyle = `rgb(${LINE})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx, 44); ctx.lineTo(cx, base + 8); ctx.stroke();
    label.style.left = `${clamp(cx, 70, w - 70)}px`;
  };
  drawRuler(0);
  addEventListener("resize", () => drawRuler(0));
  if (reduce) return;

  const cells = [...document.querySelectorAll(".cell")];
  runPortal((time, { y, vh }) => {
    drawRuler(Math.sin(y / 320) * .35);
    cells.forEach((c) => { const r = c.getBoundingClientRect(); c.classList.toggle("on", r.top < vh * .5 && r.bottom > vh * .5); });
  });
})();
</script>
