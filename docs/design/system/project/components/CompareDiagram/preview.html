<figure class="dg dg--compare" style="padding:24px"><figcaption class="dg__head mono"><span>[ Diagram ]</span><span>Extraction treated as settled vs kept reviewable</span></figcaption>
<div class="compare" style="--cols:2"><div><h4>Extraction as final data</h4><ul><li>Model output lands in the same place as confirmed contract data</li><li>A single loading spinner hides started, partial, and failed extraction</li><li>Users cannot tell whether a date came from a model or a person</li></ul></div><div><h4>LedgerGuard review boundary</h4><ul><li>Suggested and confirmed values are stored and rendered differently</li><li>Values cross the boundary only through explicit review</li><li>Partial, failed, and review-required are first-class product states</li></ul></div></div>
<p class="dg__cap">A notice-window decision depends on knowing whether a date was extracted or confirmed, so that distinction has to survive every layer.</p></figure>
