<figure class="dg dg--layers" style="padding:24px"><figcaption class="dg__head mono"><span>[ Diagram ]</span><span>LedgerGuard system layers</span></figcaption>
<ol class="layers"><li><span class="mono">01</span><b>Next.js App Router product</b><span>Server-rendered product surfaces, with client components only where review interactions need them.</span></li><li class="on"><span class="mono">02</span><b>Node.js/Fastify API</b><span>Owns deterministic contract data, API rules, authentication, and tenant scoping.</span></li><li><span class="mono">03</span><b>Supabase PostgreSQL, Auth, Storage</b><span>The tenant-scoped data model, where suggested and confirmed values are stored differently.</span></li><li><span class="mono">04</span><b>Redis/BullMQ orchestration</b><span>Explicit job contracts that let document processing retry or fail independently.</span></li><li><span class="mono">05</span><b>Python extraction worker</b><span>AWS Textract and OpenAI extraction, isolated from deterministic contract state.</span></li></ol>
<p class="dg__cap">Probabilistic extraction sits at the bottom of the stack, behind job contracts, so it cannot bypass authentication, tenant boundaries, or review.</p></figure>
